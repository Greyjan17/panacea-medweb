function calcAtero(ct,hdl,ldl,tg){

function calcSM(row,sx){

  var ps=parseFloat(row.pa_sistolica),pd=parseFloat(row.pa_diastolica),ca=parseFloat(row.circunferencia_abdominal);
  var cr={

    tg:!isNaN(tg)?tg>=150:null,
    hdl:!isNaN(hdl)?(sx==="M"?hdl<40:hdl<50):null,
    pa:(!isNaN(ps)&&!isNaN(pd))?(ps>=130||pd>=85):null,
    gl:!isNaN(gl)?gl>=100:null

  var pos=Object.values(cr).filter(function(v){return v===true;}).length;
  var ot=[cr.tg,cr.hdl,cr.pa,cr.gl].filter(function(v){return v===true;}).length;
  var dx="Sin criterios";
  if(cr.ca!==null){
    if(cr.ca&&ot>=2)dx="Síndrome Metabólico ✓";
    else if(cr.ca&&ot===1)dx="Riesgo SM (CA+1)";
    else if(cr.ca)dx="Obesidad central sin SM";

  }else{dx=pos>=3?"Posible SM (sin CA)":"Sin criterios";}
  return{cr:cr,pos:pos,dx:dx,ot:ot};
}
function calcSem(row){
  var a=0;
  if(row.imc>30)a+=2;else if(row.imc>25)a++;

  if(row.hdl<40)a+=2;
  if(row.ldl>160)a+=2;else if(row.ldl>130)a++;
  if(row.trigliceridos>500)a+=3;else if(row.trigliceridos>200)a+=2;else if(row.trigliceridos>150)a++;
  if(row.glucosa_ayunas>126)a+=3;else if(row.glucosa_ayunas>100)a++;
  if(row.hba1c>6.5)a+=3;else if(row.hba1c>5.7)a++;

}

  var d=((a-b)/b*100).toFixed(1);

// ── Botón mic individual (dicta en un campo) ──────────────────
function MicBtn(p){
  var active=useState(false);var isActive=active[0];var setActive=active[1];
  var recRef=useRef(null);
  function toggle(){
    if(isActive){
      if(recRef.current){try{recRef.current.stop();}catch(e){}}
      recRef.current=null;setActive(false);
    }else{
      if(!hasSpeech){alert("Usa Chrome o Edge para dictado por voz.");return;}
      var rec=new SR();
      rec.lang="es-PE";rec.continuous=true;rec.interimResults=false;
      rec.onresult=function(e){
        var t=Array.from(e.results).map(function(r){return r[0].transcript;}).join(" ");
        p.onAppend(t);
      };
      rec.onerror=function(){setActive(false);};
      rec.onend=function(){setActive(false);};
      recRef.current=rec;rec.start();setActive(true);
    }
  }
  return React.createElement("button",{
    onClick:toggle,
    title:isActive?"Detener dictado":"Dictar por voz",
    style:{background:isActive?"#FC8181":"#E8F2FF",border:"1px solid "+(isActive?"#FC8181":"#4A90D9"),borderRadius:7,padding:"5px 9px",cursor:"pointer",fontSize:15,lineHeight:1,flexShrink:0,alignSelf:"flex-end",marginBottom:1,animation:isActive?"micpulse 1s infinite":"none"}
  },isActive?"⏹":"🎙");
}

  var W=580,H=200,pL=38,pR=24,pT=8,pB=28,cW=W-pL-pR,cH=H-pT-pB;

  if(data.length<2)return React.createElement("div",{style:{textAlign:"center",padding:16,color:C.textSoft,fontSize:12}},"Se necesitan al menos 2 consultas para el gráfico");
  var allV=[];
  data.forEach(function(d){params.forEach(function(k){var v=parseFloat(d[k]);if(!isNaN(v))allV.push(v);});});
  refs.forEach(function(r){allV.push(r.y);});
  if(!allV.length)return null;
  var minV=Math.min.apply(null,allV)*0.9,maxV=Math.max.apply(null,allV)*1.1;
  if(minV===maxV){minV*=0.8;maxV*=1.2;}
  function xp(i){return pL+i*(cW/(data.length-1));}
  function yp(v){return pT+cH-(((v-minV)/(maxV-minV))*cH);}
  var elems=[];
  // grid
  [0,0.25,0.5,0.75,1].forEach(function(t,i){
    elems.push(React.createElement("line",{key:"g"+i,x1:pL,y1:pT+t*cH,x2:W-pR,y2:pT+t*cH,stroke:C.border,strokeDasharray:"3 3"}));
  });
  // y labels
  [0,0.5,1].forEach(function(t,i){
    var v=(minV+(1-t)*(maxV-minV)).toFixed(0);
    elems.push(React.createElement("text",{key:"yl"+i,x:pL-3,y:pT+t*cH+4,textAnchor:"end",fontSize:9,fill:C.textSoft},v));
  });
  // x labels
  data.forEach(function(d,i){
    elems.push(React.createElement("text",{key:"xl"+i,x:xp(i),y:H-4,textAnchor:"middle",fontSize:9,fill:C.textSoft},d.fecha?d.fecha.slice(5):""));
  });
  // ref lines
  refs.forEach(function(r,i){
    elems.push(React.createElement("line",{key:"rl"+i,x1:pL,y1:yp(r.y),x2:W-pR,y2:yp(r.y),stroke:r.color,strokeDasharray:"5 3",strokeWidth:1.5}));
    elems.push(React.createElement("text",{key:"rt"+i,x:W-pR+2,y:yp(r.y)+4,fontSize:8,fill:r.color},r.label));
  });
  // lines + dots
  params.forEach(function(k){
    var m=meta[k];if(!m)return;
    var pts=data.map(function(d,i){var v=parseFloat(d[k]);return isNaN(v)?null:{x:xp(i),y:yp(v)};});
    for(var i=0;i<pts.length-1;i++){
      if(pts[i]&&pts[i+1])elems.push(React.createElement("line",{key:k+"l"+i,x1:pts[i].x,y1:pts[i].y,x2:pts[i+1].x,y2:pts[i+1].y,stroke:m.color,strokeWidth:2}));
    }
    pts.forEach(function(pt,i){
      if(pt)elems.push(React.createElement("circle",{key:k+"d"+i,cx:pt.x,cy:pt.y,r:3,fill:m.color}));
    });
  });
  var legend=params.map(function(k){
    var m=meta[k];if(!m)return null;
    return React.createElement("div",{key:k,style:{display:"flex",alignItems:"center",gap:4,fontSize:10}},
      React.createElement("div",{style:{width:14,height:3,background:m.color,borderRadius:2}}),
      React.createElement("span",{style:{color:C.textSoft}},m.label)
    );
  });
  return React.createElement("div",null,
    React.createElement("div",{style:{overflowX:"auto"}},React.createElement("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",maxWidth:W,display:"block"}},elems)),
    React.createElement("div",{style:{display:"flex",gap:10,flexWrap:"wrap",marginTop:8,paddingLeft:pL}},legend)
  );
}

  function bColor(e){return e==="guardada"?C.green:e==="pendiente-médico"?C.amber:C.gray;}

  function exportarInformeEmpresa(empresa){
    var pacs=hist.filter(function(h){return h.paciente.empresa===empresa;});
    if(!pacs.length){toast("Sin pacientes para esta empresa");return;}
    var aptos=pacs.filter(function(h){return h.aptitud&&h.aptitud.resultado==="Apto";}).length;
    var restric=pacs.filter(function(h){return h.aptitud&&h.aptitud.resultado&&h.aptitud.resultado.includes("restricciones");}).length;
    var noAptos=pacs.filter(function(h){return h.aptitud&&h.aptitud.resultado&&h.aptitud.resultado.includes("No apto");}).length;
    var rows=pacs.map(function(h){
      var aptRes=h.aptitud?h.aptitud.resultado:"—";
      var aptBg=aptRes==="Apto"?"#48BB78":aptRes.includes("restricciones")?"#F6AD55":"#FC8181";
      var aptSpan='<span style="background:'+aptBg+';color:#fff;border-radius:12px;padding:2px 10px;font-size:11px;font-weight:700">'+aptRes+'</span>';
      var dx=h.diagnostico?h.diagnostico.cie10||"—":"—";
      return '<tr><td>'+h.paciente.nombre+'</td><td>'+h.paciente.dni+'</td><td>'+h.paciente.cargo+'</td><td>'+h.fecha+'</td><td>'+aptSpan+'</td><td>'+dx+'</td></tr>';
    }).join("");
    var html='<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Informe '+empresa+'</title>'
      +'<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Segoe UI,sans-serif;background:#F5F9FF;color:#2D3748;font-size:13px}'
      +'.pag{max-width:900px;margin:32px auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 20px rgba(74,144,217,.15)}'
      +'.hdr{background:linear-gradient(135deg,#4A90D9,#38B2AC);color:#fff;padding:28px 36px}'
      +'.stats{display:flex;gap:16px;padding:20px 36px;background:#F7FAFC;border-bottom:1px solid #E2E8F0}'
      +'.stat{flex:1;text-align:center;background:#fff;border-radius:10px;padding:14px;border:1px solid #E2E8F0}'
      +'.sv{font-size:28px;font-weight:900;line-height:1}.sl{font-size:11px;font-weight:700;text-transform:uppercase;margin-top:3px}'
      +'table{width:100%;border-collapse:collapse;font-size:12px}th{background:#F7FAFC;padding:10px 14px;text-align:left;font-weight:700;color:#718096;border-bottom:1px solid #E2E8F0}'
      +'td{padding:9px 14px;border-bottom:1px solid #E2E8F0}tr:hover{background:#F7FAFC}'
      +'.ftr{padding:16px 36px;text-align:center;font-size:10px;color:#718096;border-top:1px solid #E2E8F0}'
      +'@media print{body{background:#fff}.pag{box-shadow:none;margin:0;border-radius:0}}</style></head><body>'
      +'<div class="pag">'
      +'<div class="hdr"><div style="font-size:11px;opacity:.8;margin-bottom:4px">INFORME MÉDICO OCUPACIONAL</div>'
      +'<div style="font-size:24px;font-weight:900">'+empresa+'</div>'
      +'<div style="font-size:12px;opacity:.8;margin-top:6px">Dr. Miguel W. Ochoa Cuadros · CMP 102517 · Generado: '+new Date().toLocaleDateString("es-PE",{year:"numeric",month:"long",day:"numeric"})+'</div></div>'
      +'<div class="stats">'
      +'<div class="stat"><div class="sv" style="color:#4A90D9">'+pacs.length+'</div><div class="sl" style="color:#4A90D9">Total evaluados</div></div>'
      +'<div class="stat"><div class="sv" style="color:#48BB78">'+aptos+'</div><div class="sl" style="color:#48BB78">Aptos</div></div>'
      +'<div class="stat"><div class="sv" style="color:#F6AD55">'+restric+'</div><div class="sl" style="color:#F6AD55">Con restricciones</div></div>'
      +'<div class="stat"><div class="sv" style="color:#FC8181">'+noAptos+'</div><div class="sl" style="color:#FC8181">No aptos</div></div>'

      +'</div>'
      +'<div style="padding:20px 36px"><table><thead><tr><th>Nombre</th><th>DNI</th><th>Cargo</th><th>Fecha HC</th><th>Aptitud</th><th>Diagnóstico</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      +'<div class="ftr"><strong style="color:#4A90D9">PANACEA MEDICINA OCUPACIONAL</strong> · panaceamedocup@gmail.com · Arequipa, Perú</div>'

    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    toast("⬇ Informe exportado: "+pacs.length+" pacientes");
  }

  // ── RENDER ────────────────────────────────────────────────────
  return (
    <div style={{minHeight:"100vh",background:C.bg,fontFamily:"'Segoe UI',system-ui,sans-serif",color:C.text}}>
      {notif&&<div style={{position:"fixed",top:16,right:16,background:C.teal,color:"#fff",padding:"10px 18px",borderRadius:10,fontWeight:700,fontSize:13,zIndex:999,boxShadow:"0 4px 16px rgba(0,0,0,.12)"}}>{notif}</div>}

      {/* HEADER */}
      <div style={{background:"linear-gradient(135deg,#4A90D9 0%,#38B2AC 100%)",color:"#fff",padding:"14px 24px",boxShadow:"0 2px 12px rgba(74,144,217,.3)"}}>
        <div style={{maxWidth:980,margin:"0 auto",display:"flex",alignItems:"center",gap:14}}>
          <div style={{width:46,height:46,borderRadius:"50%",background:"rgba(255,255,255,.2)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:20,flexShrink:0}}>P</div>
          <div>
            <div style={{fontSize:21,fontWeight:900,letterSpacing:1}}>PANACEA MEDWEB</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,.85)",display:"flex",alignItems:"center",gap:6}}>
              Historia Clínica con IA · Dr. Ochoa Cuadros CMP 102517

          {[{k:"historial",l:"📋 Historial"},{k:"editor",l:"✏ Editor HC"},{k:"dashboard",l:"📊 Dashboard Metabólico"},{k:"epidemio",l:"🏭 Epidemiología"}].map(function(n){

              ⬇ Importar Enfermería {pendEnf>0&&<span style={{background:"rgba(255,255,255,.3)",borderRadius:"50%",width:18,height:18,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:900}}>{pendEnf}</span>}
            </button>
          </div>
        </div>
      </div>

      <div style={{maxWidth:980,margin:"0 auto",padding:"20px 14px"}}>

        {/* HISTORIAL */}
        {vista==="historial"&&(
          <div>
            <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap",alignItems:"flex-end"}}>
              <input style={{border:"1px solid "+C.border,borderRadius:8,padding:"8px 12px",fontSize:13,background:C.grayLight,outline:"none",color:C.text,flex:2,minWidth:200}} placeholder="🔍 Nombre o DNI..." value={bPac} onChange={function(e){setBPac(e.target.value);}}/>
              <input type="date" style={{border:"1px solid "+C.border,borderRadius:8,padding:"8px 12px",fontSize:13,background:C.grayLight,outline:"none",color:C.text,flex:1,minWidth:140}} value={bFecha} onChange={function(e){setBFecha(e.target.value);}}/>
              <select style={{border:"1px solid "+C.border,borderRadius:8,padding:"8px 12px",fontSize:13,background:C.grayLight,color:C.text,flex:1,minWidth:140}} value={bEmp} onChange={function(e){setBEmp(e.target.value);}}>
                <option value="">Todas las empresas</option>{empresas.map(function(e){return <option key={e} value={e}>{e}</option>;})}
              </select>
              {/* Filtro aptitud */}
              <select style={{border:"1px solid "+C.border,borderRadius:8,padding:"8px 12px",fontSize:13,background:C.grayLight,color:C.text,minWidth:160}} value={filtApt} onChange={function(e){setFiltApt(e.target.value);}}>
                <option value="">Todas las aptitudes</option>
                <option value="Apto">✅ Apto</option>
                <option value="restricciones">⚠ Con restricciones</option>
                <option value="No apto">❌ No apto</option>
              </select>
              {(bPac||bFecha||bEmp||filtApt)&&<Btn label="✕ Limpiar" onClick={function(){setBPac("");setBFecha("");setBEmp("");setFiltApt("");}} color={C.gray} small/>}
              <span style={{fontSize:12,color:C.textSoft,whiteSpace:"nowrap"}}>{filtrados.length} registro(s)</span>
              {bEmp&&<Btn label="⬇ Informe empresa" onClick={function(){exportarInformeEmpresa(bEmp);}} color={C.teal} small/>}
            </div>
            {ldgDB?<div style={{textAlign:"center",padding:"52px 0",color:C.textSoft}}>⏳ Cargando...</div>

            :(
              <div style={{background:C.white,border:"1px solid "+C.border,borderRadius:14,overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,.05)"}}>
                {filtrados.map(function(h,i){
                  return(
                    <div key={h.id} onClick={function(){abrirHC(h);}} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 16px",borderBottom:i<filtrados.length-1?"1px solid "+C.border:"none",cursor:"pointer",background:i%2===0?C.white:C.grayLight}}>
                      <div style={{width:36,height:36,borderRadius:"50%",background:C.blueLight,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,color:C.blue,fontSize:14,flexShrink:0}}>{(h.paciente.nombre[0]||"?").toUpperCase()}</div>

                        {h.fromEnf&&<span style={{background:C.teal,color:"#fff",borderRadius:20,padding:"2px 9px",fontSize:10,fontWeight:700}}>ENF</span>}
                        {h.interconsultas&&h.interconsultas.filter(function(ic){return ic.estado==="Pendiente";}).length>0&&<span style={{background:C.purple,color:"#fff",borderRadius:20,padding:"2px 9px",fontSize:10,fontWeight:700}}>🔀 {h.interconsultas.filter(function(ic){return ic.estado==="Pendiente";}).length} IC</span>}
                      </div>
                      <button onClick={function(e){e.stopPropagation();eliminar(h.id);}} style={{background:C.redLight,border:"1px solid "+C.red,color:C.red,borderRadius:7,padding:"4px 9px",cursor:"pointer",fontSize:11,fontWeight:700,marginLeft:4}}>🗑</button>
                      <button onClick={function(e){e.stopPropagation();nuevaHCdesdePaciente(h.paciente.dni);}} title="Nueva HC usando datos de este paciente" style={{background:C.blueLight,border:"1px solid "+C.blue,color:C.blue,borderRadius:7,padding:"4px 9px",cursor:"pointer",fontSize:11,fontWeight:700,marginLeft:4}}>📋+</button>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {/* EDITOR */}
        {vista==="editor"&&(
          <div>
            <div style={{display:"flex",gap:8,marginBottom:14,alignItems:"center",flexWrap:"wrap"}}>
              <button onClick={function(){setVista("historial");}} style={{background:C.grayLight,border:"1px solid "+C.border,borderRadius:8,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",color:C.text}}>← Historial</button>

              {autoTs&&<span style={{fontSize:10,color:C.green,fontWeight:700}}>✓ Autoguardado {autoTs}</span>}
              <div style={{marginLeft:"auto",display:"flex",gap:8}}>
                <Btn label="💾 Guardar" onClick={guardar} color={C.green} small/>
                <Btn label="⬇ Exportar" onClick={exportar} color={C.blue} small/>
              </div>
            </div>

            {/* PANEL DICTADO GLOBAL */}

                <div style={{fontWeight:700,fontSize:13,color:C.text}}>🎙 Dictado Global</div>

                  {dictActive?"⏹ Detener":"🎙 Iniciar dictado"}
                </button>
                {dictTxt&&!dictActive&&<Btn label={dictProc?"⏳ Procesando...":"✦ Distribuir con IA"} onClick={procesarDict} disabled={dictProc} color={C.purple} small/>}
                {dictTxt&&<Btn label="🗑 Limpiar" onClick={function(){setDictTxt("");}} color={C.gray} small/>}

              </div>

                      <Field label="Especialidad" value={ic.especialidad} onChange={function(v){updIC(ic.id,"especialidad",v);}} type="select" options={ESPEC}/>
                      <Field label="Urgencia"     value={ic.urgencia}    onChange={function(v){updIC(ic.id,"urgencia",v);}}    type="select" options={["Electiva","Preferente","Urgente"]}/>

                    <Field label="Motivo" value={ic.motivo} onChange={function(v){updIC(ic.id,"motivo",v);}} type="textarea" full/>

                <input value={dashBusq} onChange={function(e){setDashBusq(e.target.value);}} placeholder="🔍 Buscar paciente..." style={{width:"100%",border:"1px solid "+C.border,borderRadius:8,padding:"10px 14px",fontSize:14,background:C.white,outline:"none",color:C.text,boxSizing:"border-box",marginBottom:14}}/>
                <div style={{background:C.white,border:"1px solid "+C.border,borderRadius:12,overflow:"hidden"}}>
                  {hist.filter(function(h){var n=(h.paciente&&h.paciente.nombre?h.paciente.nombre:"").toLowerCase();return n.includes(dashBusq.toLowerCase())||(h.paciente&&h.paciente.dni?h.paciente.dni:"").includes(dashBusq);}).filter(function(h,i,arr){return arr.findIndex(function(x){return x.paciente&&h.paciente&&x.paciente.dni===h.paciente.dni;})===i;}).map(function(h,i,arr){

                          ...(pSel.includes("colesterol_total")?[{y:200,color:C.purple,label:"CT 200"}]:[]),

                      </Card>
                      <Card title="Tabla Comparativa" icon="📋" accent={C.tealLight} tagColor={C.teal}>
                        <div style={{overflowX:"auto"}}>
                          <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                            <thead><tr style={{background:C.grayLight}}>
                              <th style={{padding:"7px 10px",textAlign:"left",fontWeight:700,color:C.textSoft,borderBottom:"1px solid "+C.border}}>Parámetro</th>
                              {dashC.map(function(c){return<th key={c.id} style={{padding:"7px 10px",textAlign:"center",fontWeight:700,color:C.blue,borderBottom:"1px solid "+C.border,whiteSpace:"nowrap"}}>{c.fecha}<button onClick={function(){delMet(c.id);}} style={{marginLeft:4,background:"none",border:"none",cursor:"pointer",color:C.red,fontSize:10}}>🗑</button></th>;})}
                            </tr></thead>
                            <tbody>
                              {Object.keys(PARAMS).map(function(k){var p=PARAMS[k];return(
                                <tr key={k} style={{borderBottom:"1px solid "+C.border}}>
                                  <td style={{padding:"6px 10px",fontWeight:600,whiteSpace:"nowrap"}}>{p.label} <span style={{color:C.textSoft,fontSize:9}}>({p.unit})</span></td>
                                  {dashC.map(function(c,i){var val=parseFloat(c[k]);var prev=i>0?parseFloat(dashC[i-1][k]):null;var t=tend(val,prev);var s2=pStatus(k,val);return(
                                    <td key={c.id} style={{padding:"6px 10px",textAlign:"center"}}>
                                      <span style={{color:s2.color,fontWeight:700}}>{val||"—"}</span>
                                      {t&&<span style={{color:t.color,fontSize:9,marginLeft:3}}>{t.icon}{t.d}%</span>}
                                    </td>
                                  );})}
                                </tr>
                              );})}
                              <tr style={{background:C.grayLight}}>
                                <td style={{padding:"6px 10px",fontWeight:700}}>Semáforo</td>
                                {dashC.map(function(c){var s2=c.semaforo||calcSem(c);return<td key={c.id} style={{padding:"6px 10px",textAlign:"center"}}><span style={{background:riskColor(s2),color:"#fff",borderRadius:20,padding:"2px 8px",fontSize:10,fontWeight:700}}>{s2}</span></td>;})}
                              </tr>
                            </tbody>
                          </table>
                        </div>
                      </Card>
                      <Card title="Análisis con IA" icon="🤖" accent={C.purpleLight} tagColor={C.purple}>
                        <Btn label={ldgIA?"⏳ Analizando...":"✦ Analizar evolución completa con IA"} onClick={analIA} disabled={ldgIA} color={C.purple}/>
                        {ultiC&&ultiC.analisis_ia&&<div style={{background:C.purpleLight,border:"1px solid "+C.purple,borderRadius:10,padding:14,fontSize:12,lineHeight:1.8,whiteSpace:"pre-wrap",marginTop:12}}>{ultiC.analisis_ia}</div>}
                      </Card>
                    </div>
                  )}
                </div>
              );
            })()}

            {dashV==="nueva"&&dashPac&&(
              <div>
                <Card title="Antropométricos + PA" icon="⚖" accent={C.tealLight} tagColor={C.teal}>
                  <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
                    {[["fecha","Fecha","date"],["peso","Peso (kg)","number"],["talla","Talla (m)","number"]].map(function(arr){var k=arr[0],l=arr[1],t=arr[2];return(
                      <div key={k} style={{display:"flex",flexDirection:"column",gap:2,flex:1,minWidth:110}}>
                        <label style={{fontSize:10,fontWeight:700,color:C.textSoft,textTransform:"uppercase"}}>{l}</label>
                        <input type={t} value={dashF[k]} onChange={function(e){updD(k,e.target.value);}} style={{border:"1px solid "+C.border,borderRadius:7,padding:"7px 8px",fontSize:13,background:C.grayLight,outline:"none",color:C.text,width:"100%",boxSizing:"border-box"}}/>
                      </div>
                    );})}
                    <div style={{display:"flex",flexDirection:"column",gap:2,flex:1,minWidth:130}}>
                      <label style={{fontSize:10,fontWeight:700,color:C.red,textTransform:"uppercase"}}>Circ. Abd. (cm) ★SM</label>
                      <input type="number" value={dashF.circunferencia_abdominal} onChange={function(e){updD("circunferencia_abdominal",e.target.value);}} style={{border:"1px solid "+C.red,borderRadius:7,padding:"7px 8px",fontSize:13,background:C.grayLight,outline:"none",color:C.text,width:"100%",boxSizing:"border-box"}}/>
                    </div>
                    <div style={{display:"flex",flexDirection:"column",gap:2,flex:1,minWidth:100}}>
                      <label style={{fontSize:10,fontWeight:700,color:C.textSoft,textTransform:"uppercase"}}>IMC</label>
                      <div style={{display:"flex",gap:4}}>
                        <input value={dashF.imc} onChange={function(e){updD("imc",e.target.value);}} style={{flex:1,border:"1px solid "+C.border,borderRadius:7,padding:"7px 8px",fontSize:13,background:C.grayLight,outline:"none",color:C.text}}/>
                        <button onClick={calcIMC} style={{background:C.teal,border:"none",borderRadius:7,padding:"7px 10px",color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer"}}>Calc</button>
                      </div>
                    </div>
                    {[["pa_sistolica","PA Sist."],["pa_diastolica","PA Diast."]].map(function(arr){var k=arr[0],l=arr[1];return(
                      <div key={k} style={{display:"flex",flexDirection:"column",gap:2,flex:1,minWidth:100}}>
                        <label style={{fontSize:10,fontWeight:700,color:C.textSoft,textTransform:"uppercase"}}>{l}</label>
                        <input type="number" value={dashF[k]} onChange={function(e){updD(k,e.target.value);}} style={{border:"1px solid "+C.border,borderRadius:7,padding:"7px 8px",fontSize:13,background:C.grayLight,outline:"none",color:C.text,width:"100%",boxSizing:"border-box"}}/>
                      </div>
                    );})}
                  </div>
                </Card>
                <Card title="Perfil Lipídico" icon="🧪" accent={C.purpleLight} tagColor={C.purple}>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
                    {[["colesterol_total","CT"],["hdl","HDL"],["ldl","LDL"],["vldl","VLDL"],["trigliceridos","TG"]].map(function(arr){var k=arr[0],l=arr[1];return(
                      <div key={k} style={{display:"flex",flexDirection:"column",gap:2,flex:1,minWidth:90}}>
                        <label style={{fontSize:10,fontWeight:700,color:C.textSoft,textTransform:"uppercase"}}>{l}</label>
                        <input type="number" value={dashF[k]} onChange={function(e){updD(k,e.target.value);}} style={{border:"1px solid "+C.border,borderRadius:7,padding:"7px 8px",fontSize:13,background:C.grayLight,outline:"none",color:C.text,width:"100%",boxSizing:"border-box"}}/>
                      </div>
                    );})}
                  </div>
                  {(ateroF.ct_hdl||ateroF.ldl_hdl||ateroF.tg_hdl)&&<div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:8}}><AB label="CT/HDL" value={ateroF.ct_hdl} riesgo={ateroF.ct_hdl_r}/><AB label="LDL/HDL" value={ateroF.ldl_hdl} riesgo={ateroF.ldl_hdl_r}/><AB label="TG/HDL" value={ateroF.tg_hdl} riesgo={ateroF.tg_hdl_r}/></div>}
                </Card>
                <Card title="Glucometría + Renal" icon="🍬" accent={C.amberLight} tagColor={C.amber}>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    {[["glucosa_ayunas","Glucosa"],["hba1c","HbA1c"],["acido_urico","Ác.Úrico"],["creatinina","Creatinina"]].map(function(arr){var k=arr[0],l=arr[1];return(
                      <div key={k} style={{display:"flex",flexDirection:"column",gap:2,flex:1,minWidth:90}}>
                        <label style={{fontSize:10,fontWeight:700,color:C.textSoft,textTransform:"uppercase"}}>{l}</label>
                        <input type="number" value={dashF[k]} onChange={function(e){updD(k,e.target.value);}} style={{border:"1px solid "+C.border,borderRadius:7,padding:"7px 8px",fontSize:13,background:C.grayLight,outline:"none",color:C.text,width:"100%",boxSizing:"border-box"}}/>
                      </div>
                    );})}
                  </div>
                </Card>
                <Card title="Clasificación" icon="🏷" accent={C.redLight} tagColor={C.red}>
                  <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                    <Field label="Riesgo CV" value={dashF.riesgo_cardiovascular} onChange={function(v){updD("riesgo_cardiovascular",v);}} type="select" options={["Bajo","Moderado","Alto","Muy alto"]}/>
                    <Field label="Dx Metabólico" value={dashF.dx_metabolico} onChange={function(v){updD("dx_metabolico",v);}} type="select" options={["Normal","Sobrepeso","Obesidad grado I","Obesidad grado II","Obesidad grado III","Síndrome metabólico","DM tipo 2","Prediabetes","HTA","Dislipidemia mixta","Hipercolesterolemia","Hipertrigliceridemia","Hiperuricemia"]}/>
                  </div>
                </Card>
                <div style={{display:"flex",gap:8,justifyContent:"flex-end",paddingBottom:24}}>
                  <button onClick={function(){setDashV("dashboard");}} style={{background:C.grayLight,border:"1px solid "+C.border,borderRadius:8,padding:"8px 14px",fontSize:12,fontWeight:700,cursor:"pointer",color:C.text}}>← Cancelar</button>
                  <Btn label="💾 Guardar consulta" onClick={saveMet} color={C.green}/>
                </div>
              </div>
            )}
          </div>
        )}

        {/* EPIDEMIOLOGÍA */}
        {vista==="epidemio"&&(function(){
          var emp2=Array.from(new Set(hist.map(function(h){return h.paciente.empresa;}).filter(Boolean)));
          var base=bEmp?hist.filter(function(h){return h.paciente.empresa===bEmp;}):hist;
          var gData=GRUPOS.map(function(g){
            var pacs=base.filter(function(h){return clasGrupo(h.antOcup&&h.antOcup.exposiciones?h.antOcup.exposiciones:"")===g.id;});
            var ac={Apto:0,"Apto con restricciones":0,"No apto":0};
            pacs.forEach(function(h){var a=h.aptitud?h.aptitud.resultado||"":"";if(a==="Apto")ac.Apto++;else if(a.includes("restricciones"))ac["Apto con restricciones"]++;else if(a.includes("No apto"))ac["No apto"]++;});
            var dm={};pacs.forEach(function(h){var d=h.diagnostico?h.diagnostico.cie10:null;if(d)dm[d]=(dm[d]||0)+1;});
            var dxT=Object.entries(dm).sort(function(a,b){return b[1]-a[1];}).slice(0,3);
            return Object.assign({},g,{count:pacs.length,ac:ac,dxT:dxT,pacs:pacs});
          }).filter(function(g){return g.count>0||g.id==="sin_exp";});
          var dxM={};base.forEach(function(h){var d=h.diagnostico?h.diagnostico.cie10:null;if(d)dxM[d]=(dxM[d]||0)+1;});
          var topDx=Object.entries(dxM).sort(function(a,b){return b[1]-a[1];}).slice(0,8);
          var aptT={"Apto":0,"Apto con restricciones":0,"No apto temporal":0,"No apto permanente":0};
          base.forEach(function(h){var a=h.aptitud?h.aptitud.resultado:null;if(a&&aptT[a]!==undefined)aptT[a]++;});
          var icP=hist.reduce(function(acc,h){return acc.concat((h.interconsultas||[]).filter(function(ic){return ic.estado==="Pendiente";}).map(function(ic){return Object.assign({},ic,{pac:h.paciente.nombre,emp:h.paciente.empresa,fecha:h.fecha});}));;},[]);
          var hoy=new Date();
          var venc=hist.filter(function(h){if(!h.fecha)return false;var f=new Date(h.fecha);f.setFullYear(f.getFullYear()+1);return f<hoy;});
          var prox=hist.filter(function(h){if(!h.fecha)return false;var f=new Date(h.fecha);f.setFullYear(f.getFullYear()+1);var d=Math.floor((f-hoy)/(1000*60*60*24));return d>=0&&d<=30;});
          var gSel=epiG?gData.find(function(g){return g.id===epiG;}):null;
          return(
            <div>
              <div style={{display:"flex",gap:10,marginBottom:16,alignItems:"center",flexWrap:"wrap"}}>
                <select style={{border:"1px solid "+C.border,borderRadius:8,padding:"8px 12px",fontSize:13,background:C.white,color:C.text}} value={bEmp} onChange={function(e){setBEmp(e.target.value);}}>
                  <option value="">Todas las empresas</option>{emp2.map(function(e){return<option key={e} value={e}>{e}</option>;})}
                </select>
                <span style={{fontSize:12,color:C.textSoft}}>{base.length} paciente(s)</span>
              </div>
              <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
                {[{l:"Total",v:base.length,c:C.blue,bg:C.blueLight,i:"👥"},{l:"Aptos",v:aptT["Apto"],c:C.green,bg:C.greenLight,i:"✅"},{l:"Restricciones",v:aptT["Apto con restricciones"],c:C.amber,bg:C.amberLight,i:"⚠"},{l:"No aptos",v:aptT["No apto temporal"]+aptT["No apto permanente"],c:C.red,bg:C.redLight,i:"❌"},{l:"IC Pend.",v:icP.length,c:C.purple,bg:C.purpleLight,i:"🔀"},{l:"Vencidos",v:venc.length,c:C.red,bg:C.redLight,i:"📅"}].map(function(s){
                  return<div key={s.l} style={{flex:1,minWidth:90,background:s.bg,border:"1px solid "+s.c+"33",borderRadius:12,padding:"12px 10px",textAlign:"center"}}><div style={{fontSize:18}}>{s.i}</div><div style={{fontSize:22,fontWeight:900,color:s.c,lineHeight:1}}>{s.v}</div><div style={{fontSize:10,color:s.c,fontWeight:700,marginTop:2}}>{s.l}</div></div>;
                })}
              </div>
              <Card title="Grupos de Riesgo Ocupacional" icon="🏭" accent={C.amberLight} tagColor={C.amber} tag={gData.filter(function(g){return g.count>0;}).length+" activos"}>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
                  {gData.map(function(g){return(
                    <button key={g.id} onClick={function(){setEpiG(epiG===g.id?"":g.id);}} style={{flex:1,minWidth:90,borderRadius:10,padding:"10px 8px",border:"2px solid "+(epiG===g.id?g.color:C.border),background:epiG===g.id?g.color+"18":"white",cursor:"pointer",textAlign:"center"}}>
                      <div style={{fontSize:18}}>{g.icon}</div>
                      <div style={{fontSize:11,fontWeight:700,color:epiG===g.id?g.color:C.text,marginTop:2}}>{g.label}</div>
                      <div style={{fontSize:18,fontWeight:900,color:g.color}}>{g.count}</div>
                    </button>
                  );})}
                </div>
                {gSel&&(
                  <div style={{background:gSel.color+"10",border:"1px solid "+gSel.color,borderRadius:12,padding:14}}>
                    <div style={{fontWeight:800,fontSize:14,color:gSel.color,marginBottom:10}}>{gSel.icon} {gSel.label} — {gSel.count} trabajador(es)</div>
                    <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
                      {[["Aptos",gSel.ac.Apto,C.green],["Restricciones",gSel.ac["Apto con restricciones"],C.amber],["No aptos",gSel.ac["No apto"],C.red]].map(function(arr){var l=arr[0],v=arr[1],c=arr[2];return<div key={l} style={{flex:1,minWidth:80,background:"white",borderRadius:8,padding:8,textAlign:"center",border:"1px solid "+c+"33"}}><div style={{fontSize:18,fontWeight:900,color:c}}>{v}</div><div style={{fontSize:10,color:C.textSoft}}>{l}</div></div>;;})}
                    </div>
                    {gSel.dxT.length>0&&<div>{gSel.dxT.map(function(arr,i){var dx=arr[0],n=arr[1];return<div key={i} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:"1px solid "+gSel.color+"22"}}><span style={{fontSize:11}}>{dx}</span><span style={{fontSize:11,fontWeight:700,color:gSel.color}}>{n}</span></div>;})}</div>}
                    <div style={{marginTop:10,display:"flex",gap:6,flexWrap:"wrap"}}>
                      {gSel.pacs.map(function(h){return<div key={h.id} onClick={function(){abrirHC(h);setVista("editor");}} style={{background:"white",border:"1px solid "+gSel.color,borderRadius:7,padding:"4px 10px",fontSize:11,fontWeight:600,cursor:"pointer",color:gSel.color}}>{h.paciente.nombre||h.paciente.dni||"—"}</div>;;})}
                    </div>
                  </div>
                )}
              </Card>
              <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
                <div style={{flex:1,minWidth:260}}>
                  <Card title="Diagnósticos más frecuentes" icon="🏷" accent={C.blueLight} tagColor={C.blue} tag={"Top "+topDx.length}>
                    {topDx.length===0?<div style={{color:C.textSoft,fontSize:12,textAlign:"center"}}>Sin datos</div>
                    :topDx.map(function(arr,i){var dx=arr[0],n=arr[1];return<div key={i} style={{marginBottom:8}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:11,flex:1}}>{dx}</span><span style={{fontSize:11,fontWeight:700,color:C.blue,marginLeft:8}}>{n}</span></div><div style={{background:C.border,borderRadius:4,height:6}}><div style={{background:C.blue,borderRadius:4,height:6,width:((n/topDx[0][1])*100)+"%"}}/></div></div>;})}
                  </Card>
                </div>
                <div style={{flex:1,minWidth:260}}>
                  <Card title="Distribución de Aptitud" icon="✅" accent={C.greenLight} tagColor={C.green}>
                    {Object.entries(aptT).map(function(e2){var k=e2[0],v=e2[1];return<div key={k} style={{marginBottom:8}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:11}}>{k}</span><span style={{fontSize:11,fontWeight:700,color:k==="Apto"?C.green:k.includes("restricciones")?C.amber:C.red}}>{v} ({base.length?((v/base.length)*100).toFixed(0):0}%)</span></div><div style={{background:C.border,borderRadius:4,height:6}}><div style={{background:k==="Apto"?C.green:k.includes("restricciones")?C.amber:C.red,borderRadius:4,height:6,width:base.length?((v/base.length)*100)+"%":"0%"}}/></div></div>;})}
                  </Card>
                </div>
              </div>
              {icP.length>0&&(
                <Card title="Interconsultas Pendientes" icon="🔀" accent={C.purpleLight} tagColor={C.purple} tag={icP.length+" sin respuesta"}>
                  <div style={{overflowX:"auto"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                      <thead><tr style={{background:C.grayLight}}>{["Paciente","Empresa","Especialidad","Urgencia","Fecha"].map(function(h2){return<th key={h2} style={{padding:"7px 10px",textAlign:"left",fontWeight:700,color:C.textSoft,borderBottom:"1px solid "+C.border,whiteSpace:"nowrap"}}>{h2}</th>;})}</tr></thead>
                      <tbody>{icP.map(function(ic,i){return<tr key={i} style={{borderBottom:"1px solid "+C.border,background:i%2===0?C.white:C.grayLight}}><td style={{padding:"7px 10px",fontWeight:600}}>{ic.pac}</td><td style={{padding:"7px 10px",color:C.textSoft}}>{ic.emp||"—"}</td><td style={{padding:"7px 10px"}}>{ic.especialidad}</td><td style={{padding:"7px 10px"}}><span style={{background:ic.urgencia==="Urgente"?C.red:ic.urgencia==="Preferente"?C.amber:C.gray,color:"#fff",borderRadius:20,padding:"2px 8px",fontSize:10,fontWeight:700}}>{ic.urgencia}</span></td><td style={{padding:"7px 10px",color:C.textSoft}}>{ic.fecha}</td></tr>;})}</tbody>
                    </table>
                  </div>
                </Card>
              )}
              {(venc.length>0||prox.length>0)&&(
                <Card title="Alertas de Vencimiento" icon="📅" accent={C.redLight} tagColor={C.red} tag={(venc.length+prox.length)+" alertas"}>
                  {venc.map(function(h){return{h:h,prox:false};}).concat(prox.map(function(h){return{h:h,prox:true};})).map(function(item,i){
                    var h=item.h,isProx=item.prox;
                    var f=new Date(h.fecha);f.setFullYear(f.getFullYear()+1);var dias=Math.floor((f-hoy)/(1000*60*60*24));
                    return<div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid "+C.border}}><span style={{fontSize:16}}>{isProx?"🟡":"🔴"}</span><div style={{flex:1}}><div style={{fontWeight:700,fontSize:13}}>{h.paciente.nombre}</div><div style={{fontSize:11,color:C.textSoft}}>{h.paciente.empresa||"—"}</div></div><div style={{fontSize:11,fontWeight:700,color:isProx?C.amber:C.red}}>{isProx?"Vence en "+dias+" días":"Vencido hace "+Math.abs(dias)+" días"}</div><button onClick={function(){abrirHC(h);}} style={{background:C.blueLight,border:"1px solid "+C.blue,color:C.blue,borderRadius:7,padding:"4px 9px",cursor:"pointer",fontSize:11,fontWeight:700}}>Ver HC</button></div>;
                  })}
                </Card>
              )}
            </div>
          );
        })()}

      </div>
      <div style={{textAlign:"center",padding:"14px 0",color:C.textSoft,fontSize:11,borderTop:"1px solid "+C.border}}>
        <strong style={{color:C.blue}}>PANACEA MEDWEB</strong> · Dr. Miguel Wenceslao Ochoa Cuadros CMP 102517 · RNE/RNA 13334 · panaceamedocup@gmail.com · Arequipa, Perú
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App,null));
</script>
