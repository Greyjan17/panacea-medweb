  imc:              {min:18.5,max:24.9},

const paramStatus = (key,val) => {
  if(!val) return {color:C.border,bg:C.grayLight};
  const p = PARAM_RANGES[key]; if(!p) return {color:C.border,bg:C.grayLight};
  const n = p.parse?p.parse(val):parseFloat(val); if(isNaN(n)) return {color:C.border,bg:C.grayLight};
  if(p.inv){const c=n<p.min?C.red:C.green;return{color:c,bg:c+"18"};}
  const c=n>p.max?C.red:n<p.min?C.blue:C.green;
  return{color:c,bg:c+"18"};
};

// ── Cálculos ──────────────────────────────────────────────────
const calcAtero = (ct,hdl,ldl,tg) => {
  const r={};
  if(ct&&hdl&&hdl>0){r.ct_hdl=(ct/hdl).toFixed(2);r.ct_hdl_riesgo=ct/hdl>5?"Alto":ct/hdl>3.5?"Moderado":"Bajo";}
  if(ldl&&hdl&&hdl>0){r.ldl_hdl=(ldl/hdl).toFixed(2);r.ldl_hdl_riesgo=ldl/hdl>3.5?"Alto":ldl/hdl>2.5?"Moderado":"Bajo";}
  if(tg&&hdl&&hdl>0){r.tg_hdl=(tg/hdl).toFixed(2);r.tg_hdl_riesgo=tg/hdl>3.8?"Alto":tg/hdl>2?"Moderado":"Bajo";}
  r.global=(!r.ct_hdl_riesgo&&!r.ldl_hdl_riesgo&&!r.tg_hdl_riesgo)?null
    :[r.ct_hdl_riesgo,r.ldl_hdl_riesgo,r.tg_hdl_riesgo].includes("Alto")?"Alto"
    :[r.ct_hdl_riesgo,r.ldl_hdl_riesgo,r.tg_hdl_riesgo].includes("Moderado")?"Moderado":"Bajo";
  return r;
};

const calcSM = (row,sexo="M") => {
  const tg=parseFloat(row.trigliceridos),hdl=parseFloat(row.hdl),gluc=parseFloat(row.glucosa_ayunas);
  const pas=parseFloat(row.pa_sistolica),pad=parseFloat(row.pa_diastolica),ca=parseFloat(row.circunferencia_abdominal);
  const criterios={
    ca:!isNaN(ca)?(sexo==="M"?ca>=90:ca>=80):null,
    tg:!isNaN(tg)?tg>=150:null,
    hdl:!isNaN(hdl)?(sexo==="M"?hdl<40:hdl<50):null,
    pa:(!isNaN(pas)&&!isNaN(pad))?(pas>=130||pad>=85):null,
    gluc:!isNaN(gluc)?gluc>=100:null,
  };
  const positivos=Object.values(criterios).filter(v=>v===true).length;
  const otros=[criterios.tg,criterios.hdl,criterios.pa,criterios.gluc].filter(v=>v===true).length;
  let dx=null;
  if(criterios.ca!==null){
    if(criterios.ca&&otros>=2)dx="Síndrome Metabólico ✓";
    else if(criterios.ca&&otros===1)dx="Riesgo SM (CA + 1 criterio)";
    else if(criterios.ca)dx="Obesidad central sin SM";
    else dx="Sin SM (CA normal)";
  }else dx=positivos>=3?"Posible SM (sin CA)":"Sin criterios suficientes";
  return{criterios,positivos,dx,caPos:criterios.ca===true,otros};
};

const calcSemaforo = row => {
  let a=0;
  if(row.imc>30)a+=2;else if(row.imc>25)a++;
  if(row.pa_sistolica>140||row.pa_diastolica>90)a+=2;else if(row.pa_sistolica>130)a++;
  if(row.colesterol_total>240)a+=2;else if(row.colesterol_total>200)a++;
  if(row.hdl<40)a+=2;
  if(row.ldl>160)a+=2;else if(row.ldl>130)a++;
  if(row.trigliceridos>500)a+=3;else if(row.trigliceridos>200)a+=2;else if(row.trigliceridos>150)a++;
  if(row.glucosa_ayunas>126)a+=3;else if(row.glucosa_ayunas>100)a++;
  if(row.hba1c>6.5)a+=3;else if(row.hba1c>5.7)a++;
  if(row.acido_urico>7)a++;
  return a===0?"Verde":a<=3?"Amarillo":"Rojo";
};

const tend = (a,b) => {
  if(!a||!b)return null;
  const d=((a-b)/b*100).toFixed(1);
  if(Math.abs(d)<2)return{icon:"→",color:C.gray,d};
  return a>b?{icon:"↑",color:C.red,d:`+${d}`}:{icon:"↓",color:C.green,d};
};

async function dbGetHistorial(){
  const r=await fetch(`${SUPA_URL}/rest/v1/medweb_historial?order=updated_at.desc`,{headers:SH});
  if(!r.ok)return null;return(await r.json()).map(mapRow);
}
async function dbUpsertHC(hc){
  const row={id:hc.id,fecha:hc.fecha,paciente:hc.paciente,anamnesis:hc.anamnesis,ant_ocup:hc.antOcup,ex_fisico:hc.exFisico,laboratorio:hc.laboratorio,diagnostico:hc.diagnostico,plan:hc.plan,aptitud:hc.aptitud,interconsultas:hc.interconsultas,estado:hc.estado,from_enfermeria:hc.fromEnfermeria,updated_at:new Date().toISOString()};
  return(await fetch(`${SUPA_URL}/rest/v1/medweb_historial`,{method:"POST",headers:{...SH,"Prefer":"resolution=merge-duplicates"},body:JSON.stringify(row)})).ok;
}

// ── Claude API ────────────────────────────────────────────────
async function callClaude(prompt,web=false){
  const body={model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:prompt}]};
  if(web)body.tools=[{type:"web_search_20250305",name:"web_search"}];
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json();return d.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
}
async function readB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});}
async function callClaudePDF(b64,prompt){
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:[{type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}},{type:"text",text:prompt}]}]})});
  const d=await r.json();return d.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
}

const Field=memo(({label,value,onChange,type="text",options,full,readOnly,highlight})=>{
  const base={border:`1px solid ${highlight?C.red:C.border}`,borderRadius:8,padding:"8px 10px",fontSize:13,outline:"none",color:C.text,width:"100%",boxSizing:"border-box"};
  return(
    <div style={{display:"flex",flexDirection:"column",gap:3,flex:1,minWidth:full?"100%":150,...(full?{flex:"1 1 100%"}:{})}}>
      <label style={{fontSize:11,fontWeight:700,color:C.textSoft,textTransform:"uppercase",letterSpacing:.3}}>{label}</label>
      {type==="textarea"?<textarea value={value} onChange={e=>onChange?.(e.target.value)} style={{...base,background:C.grayLight,resize:"vertical",minHeight:72,fontFamily:"inherit"}}/>
      :type==="select"?<select value={value} onChange={e=>onChange?.(e.target.value)} style={{...base,background:C.grayLight}}>{options?.map(o=><option key={o} value={o}>{o}</option>)}</select>
      :<input type={type} value={value} onChange={e=>onChange?.(e.target.value)} readOnly={readOnly} style={{...base,background:readOnly?C.blueLight:C.grayLight}}/>}
    </div>
  );
});

const SMBadge=memo(({label,positivo,valor,noEval})=>{
  if(noEval)return(<div style={{flex:1,minWidth:130,background:C.grayLight,border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 10px"}}><div style={{fontSize:10,fontWeight:700,color:C.textSoft,textTransform:"uppercase"}}>{label}</div><div style={{fontSize:11,color:C.gray,marginTop:2}}>No evaluado</div></div>);
  const c=positivo?C.red:C.green;
  return(<div style={{flex:1,minWidth:130,background:positivo?C.redLight:C.greenLight,border:`1px solid ${c}`,borderRadius:8,padding:"8px 10px"}}><div style={{fontSize:10,fontWeight:700,color:C.textSoft,textTransform:"uppercase"}}>{label}</div><div style={{fontSize:12,fontWeight:700,color:c,marginTop:2}}>{positivo?"✗ Alterado":"✓ Normal"}</div>{valor&&<div style={{fontSize:11,color:C.textSoft,marginTop:1}}>{valor}</div>}</div>);

// ══════════════════════════════════════════════════════════════
function App(){
  const [vista,setVista]     = useState("historial");
  const [historial,setHistorial] = useState([]);
  const [hc,setHC]           = useState(emptyHC());
  const [ldg,setLdg]         = useState({});
  const [notif,setNotif]     = useState("");
  const [busqPac,setBusqPac] = useState("");
  const [busqFecha,setBusqFecha] = useState("");
  const [busqEmpresa,setBusqEmpresa] = useState("");
  const [dbOnline,setDbOnline] = useState(null);
  const [pendientesEnf,setPendientesEnf] = useState(0);
  const [loadingDB,setLoadingDB] = useState(true);
  const [dashPac,setDashPac] = useState(null);
  const [dashConsultas,setDashConsultas] = useState([]);
  const [dashBusq,setDashBusq] = useState("");
  const [dashForm,setDashForm] = useState(emptyMetForm());
  const [dashVista,setDashVista] = useState("buscar");
  const [dashParamsSel,setDashParamsSel] = useState(["imc","colesterol_total","trigliceridos","glucosa_ayunas"]);
  const [loadingIA,setLoadingIA] = useState(false);
  const [epiGrupo,setEpiGrupo] = useState("");
  const labRef=useRef(),pollRef=useRef();

  const cargarHistorial=useCallback(async()=>{const rows=await dbGetHistorial();if(rows===null){setDbOnline(false);return;}setDbOnline(true);setHistorial(rows);},[]);
  const checkPendientes=useCallback(async()=>{try{const rows=await supaGetPendientes();setPendientesEnf(rows.filter(r=>!historial.find(h=>h.id===r.id)).length);}catch{}},[historial]);
  useEffect(()=>{(async()=>{setLoadingDB(true);await cargarHistorial();setLoadingDB(false);})();},[]);
  useEffect(()=>{checkPendientes();pollRef.current=setInterval(checkPendientes,30000);return()=>clearInterval(pollRef.current);},[historial]);

  const toast=useCallback(msg=>{setNotif(msg);setTimeout(()=>setNotif(""),3500);},[]);
  const setL=useCallback((k,v)=>setLdg(l=>({...l,[k]:v})),[]);
  const upd=useCallback((sec,k,v)=>setHC(h=>({...h,[sec]:{...h[sec],[k]:v}})),[]);
  const updD=useCallback((k,v)=>setDashForm(f=>({...f,[k]:v})),[]);
  const imc=useCallback(()=>{const p=parseFloat(hc.exFisico.peso),t=parseFloat(hc.exFisico.talla);return(p&&t)?(p/(t*t)).toFixed(1):"—";},[hc.exFisico.peso,hc.exFisico.talla]);

  const empresas=useMemo(()=>[...new Set(historial.map(h=>h.paciente.empresa).filter(Boolean))]<br/>,[historial]);
  const filtrados=useMemo(()=>{const q=busqPac.toLowerCase();return historial.filter(h=>{const match=h.paciente.nombre.toLowerCase().includes(q)||h.paciente.dni.includes(q);return match&&(busqFecha?h.fecha===busqFecha:true)&&(busqEmpresa?h.paciente.empresa===busqEmpresa:true);});},[historial,busqPac,busqFecha,busqEmpresa]);
  const chartData=useMemo(()=>dashConsultas.map(c=>({fecha:c.fecha,imc:parseFloat(c.imc)||null,pa_sistolica:parseFloat(c.pa_sistolica)||null,colesterol_total:parseFloat(c.colesterol_total)||null,hdl:parseFloat(c.hdl)||null,ldl:parseFloat(c.ldl)||null,trigliceridos:parseFloat(c.trigliceridos)||null,glucosa_ayunas:parseFloat(c.glucosa_ayunas)||null,hba1c:parseFloat(c.hba1c)||null})),[dashConsultas]);
  const ultimaC=useMemo(()=>dashConsultas[dashConsultas.length-1],[dashConsultas]);
  const atero=useMemo(()=>ultimaC?calcAtero(parseFloat(ultimaC.colesterol_total),parseFloat(ultimaC.hdl),parseFloat(ultimaC.ldl),parseFloat(ultimaC.trigliceridos)):{},[ultimaC]);
  const sm=useMemo(()=>ultimaC?calcSM(ultimaC,dashPac?.paciente?.sexo||"M"):null,[ultimaC,dashPac]);
  const ateroForm=useMemo(()=>calcAtero(parseFloat(dashForm.colesterol_total),parseFloat(dashForm.hdl),parseFloat(dashForm.ldl),parseFloat(dashForm.trigliceridos)),[dashForm.colesterol_total,dashForm.hdl,dashForm.ldl,dashForm.trigliceridos]);

  const selDashPac=useCallback(async p=>{setDashPac(p);const rows=await dbGetMetabolicoByDni(p.paciente?.dni||p.dni);setDashConsultas(rows);setDashForm({...emptyMetForm(),paciente_dni:p.paciente?.dni||p.dni,paciente_nombre:p.paciente?.nombre||p.nombre});setDashVista("dashboard");},[]);
  const guardarMetabolico=useCallback(async()=>{const sem=calcSemaforo(dashForm);const ok=await dbUpsertMetabolico({...dashForm,semaforo:sem,paciente_dni:dashPac.paciente?.dni||dashPac.dni,paciente_nombre:dashPac.paciente?.nombre||dashPac.nombre,paciente_empresa:dashPac.paciente?.empresa||dashPac.empresa||""});if(ok){const rows=await dbGetMetabolicoByDni(dashPac.paciente?.dni||dashPac.dni);setDashConsultas(rows);setDashForm(emptyMetForm());setDashVista("dashboard");toast("✅ Guardado");}else toast("❌ Error al guardar");},[dashForm,dashPac,toast]);
  const eliminarMetabolico=useCallback(async id=>{await dbDeleteMetabolico(id);const rows=await dbGetMetabolicoByDni(dashPac.paciente?.dni||dashPac.dni);setDashConsultas(rows);toast("🗑 Eliminado");},[dashPac,toast]);
  const analizarIA=useCallback(async()=>{if(!dashConsultas.length){toast("Sin consultas");return;}setLoadingIA(true);const resumen=dashConsultas.map(c=>`Fecha:${c.fecha} IMC:${c.imc} CT:${c.colesterol_total} HDL:${c.hdl} LDL:${c.ldl} TG:${c.trigliceridos} Gluc:${c.glucosa_ayunas} HbA1c:${c.hba1c} PA:${c.pa_sistolica}/${c.pa_diastolica} AU:${c.acido_urico} Cr:${c.creatinina}`).join("\n");const t=await callClaude(`Médico ocupacional peruano. Analiza evolución metabólica: ${dashPac.paciente?.nombre||dashPac.nombre}.\nHistorial:\n${resumen}\nIncluye: 1.Tendencia parámetros 2.Riesgo CV Framingham 3.Síndrome metabólico IDF 4.Índice aterogénico 5.Recomendaciones farmacológicas/no farmacológicas 6.Metas próxima consulta.`);if(dashConsultas.length>0){await dbUpsertMetabolico({...ultimaC,analisis_ia:t});const rows=await dbGetMetabolicoByDni(dashPac.paciente?.dni||dashPac.dni);setDashConsultas(rows);}setLoadingIA(false);toast("✅ Análisis IA completado");},[dashConsultas,dashPac,ultimaC,toast]);
  const calcIMC=useCallback(()=>{const p=parseFloat(dashForm.peso),t=parseFloat(dashForm.talla);if(p&&t)setDashForm(f=>({...f,imc:(p/(t*t)).toFixed(1)}));},[dashForm.peso,dashForm.talla]);

  const genAnamnesis=useCallback(async()=>{setL("an",true);const t=await callClaude(`Médico ocupacional peruano. Redacta anamnesis narrativa. Motivo:"${hc.anamnesis.motivo}". Evolución:"${hc.anamnesis.tEvol}". Síntomas:"${hc.anamnesis.sintomas}". Paciente:${hc.paciente.nombre},${hc.paciente.edad}a,${hc.paciente.cargo} en ${hc.paciente.empresa}.`);upd("anamnesis","aiText",t);setL("an",false);},[hc,setL,upd]);
  const genAntOcup=useCallback(async()=>{setL("ao",true);const t=await callClaude(`Redacta antecedentes ocupacionales. Exposiciones:"${hc.antOcup.exposiciones}". Tiempo:"${hc.antOcup.tiempo}". EPPs:"${hc.antOcup.epps}". Cargo:${hc.paciente.cargo},empresa:${hc.paciente.empresa}.`);upd("antOcup","aiText",t);setL("ao",false);},[hc,setL,upd]);
  const genExFisico=useCallback(async()=>{setL("ef",true);const t=await callClaude(`Interpreta examen físico. PA:${hc.exFisico.pa},FC:${hc.exFisico.fc},FR:${hc.exFisico.fr},T°:${hc.exFisico.temp},Peso:${hc.exFisico.peso}kg,Talla:${hc.exFisico.talla}m,IMC:${imc()}. Hallazgos:"${hc.exFisico.hallazgos}".`);upd("exFisico","aiText",t);setL("ef",false);},[hc,imc,setL,upd]);
  const genDx=useCallback(async()=>{setL("dx",true);const t=await callClaude(`Sugiere diagnósticos CIE-10. Motivo:"${hc.anamnesis.motivo}",hallazgos:"${hc.exFisico.hallazgos}",lab:"${hc.laboratorio.resumen}". ${hc.paciente.edad}a,${hc.paciente.cargo}. CIE:${hc.diagnostico.cie10}.`);upd("diagnostico","aiText",t);setL("dx",false);},[hc,setL,upd]);
  const genPlan=useCallback(async()=>{setL("pl",true);const t=await callClaude(`Plan de manejo. Dx:"${hc.diagnostico.cie10}",${hc.paciente.edad}a. Farmacológico MINSA/OPS, seguimiento.`,true);upd("plan","aiText",t);setL("pl",false);},[hc,setL,upd]);
  const genAptitud=useCallback(async()=>{setL("apt",true);const t=await callClaude(`Conclusión aptitud médico-ocupacional. Resultado:"${hc.aptitud.resultado}". Restricciones:"${hc.aptitud.restricciones}". Dx:"${hc.diagnostico.cie10}". Cargo:${hc.paciente.cargo}. Ley 29783.`);upd("aptitud","aiText",t);setL("apt",false);},[hc,setL,upd]);
  const handleLabPDF=useCallback(async e=>{const file=e.target.files[0];if(!file)return;setL("lab",true);try{const b64=await readB64(file);const t=await callClaudePDF(b64,"Analiza laboratorio. Extrae valores, indica alterados, interpretación clínica medicina ocupacional.");setHC(h=>({...h,laboratorio:{aiText:t,resumen:t}}));}catch{setHC(h=>({...h,laboratorio:{...h.laboratorio,aiText:"Error al procesar PDF."}}));}setL("lab",false);},[setL]);
  const addIC=useCallback(()=>setHC(h=>({...h,interconsultas:[...h.interconsultas,{id:Date.now().toString(),especialidad:"Cardiología",motivo:"",urgencia:"Electiva",estado:"Pendiente",aiText:""}]})),[]);
  const updIC=useCallback((id,k,v)=>setHC(h=>({...h,interconsultas:h.interconsultas.map(ic=>ic.id===id?{...ic,[k]:v}:ic)})),[]);
  const delIC=useCallback(id=>setHC(h=>({...h,interconsultas:h.interconsultas.filter(ic=>ic.id!==id)})),[]);
  const genIC=useCallback(async id=>{const ic=hc.interconsultas.find(i=>i.id===id);setL("ic_"+id,true);const t=await callClaude(`Redacta interconsulta a ${ic.especialidad}. Paciente:${hc.paciente.nombre},${hc.paciente.edad}a. Dx:${hc.diagnostico.cie10}. Motivo:"${ic.motivo}". Urgencia:${ic.urgencia}.`);updIC(id,"aiText",t);setL("ic_"+id,false);},[hc,setL,updIC]);
  const guardarHC=useCallback(async()=>{const ok=await dbUpsertHC({...hc,estado:"guardada"});if(ok){await cargarHistorial();toast("✅ HC guardada");setVista("historial");}else toast("❌ Error al guardar");},[hc,cargarHistorial,toast]);
  const eliminarHC=useCallback(async id=>{if(await dbDeleteHC(id)){setHistorial(h=>h.filter(x=>x.id!==id));toast("🗑 Eliminado");}else toast("❌ Error");},[toast]);
  const nuevaHC=useCallback(()=>{setHC(emptyHC());setVista("editor");},[]);
  const abrirHC=useCallback(h=>{setHC(h);setVista("editor");},[]);

  const importarEnfermeria=useCallback(async()=>{
    try{
      const rows=await supaGetPendientes();if(!rows.length){toast("Sin pendientes de Enfermería");return;}
      const ids=historial.map(h=>h.id);
      const nuevas=rows.filter(r=>!ids.includes(r.id)).map(row=>({...emptyHC(),id:row.id,fecha:row.fecha,paciente:{nombre:row.nombre||"",dni:row.dni||"",edad:row.edad||"",sexo:"M",empresa:row.empresa||"",cargo:row.cargo||""},anamnesis:{motivo:row.motivo||"",tEvol:row.t_evol||"",sintomas:row.sintomas||"",aiText:""},antOcup:{exposiciones:row.exposiciones||"",tiempo:row.tiempo||"",epps:row.epps||"",aiText:""},exFisico:{pa:row.pa||"",fc:row.fc||"",fr:row.fr||"",temp:row.temp||"",peso:row.peso||"",talla:row.talla||"",hallazgos:"",aiText:""},laboratorio:{aiText:row.lab_resumen||"",resumen:row.lab_resumen||""},fromEnfermeria:true,estado:"pendiente-médico"}));
      if(!nuevas.length){toast("Todos ya importados");return;}
      for(const n of nuevas)await dbUpsertHC(n);
      for(const r of rows)await supaMarkAtendido(r.id);
      await cargarHistorial();setPendientesEnf(0);toast(`✅ ${nuevas.length} registro(s) importados`);
    }catch(e){toast("Error: "+e.message);}
  },[historial,cargarHistorial,toast]);

  const exportarHC=useCallback(()=>{
    const p=hc.paciente;const imcVal=imc();
    const aptColor=hc.aptitud.resultado==="Apto"?"#48BB78":hc.aptitud.resultado.includes("restricciones")?"#F6AD55":"#FC8181";
    const html=`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>HC · ${p.nombre} · ${hc.fecha}</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Georgia,serif;background:#F5F9FF;color:#2D3748;font-size:13px;line-height:1.7}.pagina{max-width:820px;margin:32px auto;background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(74,144,217,.12);overflow:hidden}.header{background:linear-gradient(135deg,#4A90D9,#38B2AC);color:#fff;padding:24px 32px;display:flex;align-items:center;gap:18px}.logo{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}.ht{font-size:22px;font-weight:900}.hs{font-size:11px;opacity:.9;margin-top:3px}.hf{margin-left:auto;text-align:right;font-size:12px;opacity:.85}.pbar{background:#EAF6FB;border-bottom:1px solid #E2E8F0;padding:14px 32px;display:flex;gap:24px;flex-wrap:wrap}.dato{display:flex;flex-direction:column}.dlbl{font-size:9px;font-weight:700;text-transform:uppercase;color:#718096}.dval{font-size:13px;font-weight:700}.body{padding:24px 32px}.sec{margin-bottom:20px;border-radius:10px;overflow:hidden;border:1px solid #E2E8F0}.stit{background:#F7FAFC;padding:8px 14px;font-size:11px;font-weight:800;text-transform:uppercase;color:#4A90D9;border-bottom:1px solid #E2E8F0}.sbody{padding:12px 14px}.ai{background:#F0FFF4;border-left:4px solid #48BB78;border-radius:0 8px 8px 0;padding:10px 14px;font-size:12px;line-height:1.7;white-space:pre-wrap;margin-top:8px}.apt{display:inline-block;padding:4px 16px;border-radius:20px;font-weight:800;font-size:13px;color:#fff;background:${aptColor};margin-bottom:10px}.firma-z{margin-top:36px;padding-top:20px;border-top:2px solid #E2E8F0;display:flex;justify-content:flex-end}.firma-c{text-align:center}.footer{background:#F7FAFC;border-top:1px solid #E2E8F0;padding:12px 32px;text-align:center;font-size:10px;color:#718096}@media print{body{background:#fff}.pagina{box-shadow:none;margin:0;border-radius:0}}</style></head><body><div class="pagina"><div class="header"><div class="logo">P</div><div><div class="ht">PANACEA MEDWEB</div><div class="hs">Historia Clínica Ocupacional</div></div><div class="hf"><div style="font-weight:700">${hc.fecha}</div><div style="margin-top:4px;background:rgba(255,255,255,.2);border-radius:6px;padding:2px 10px;font-size:10px;font-weight:700">${hc.estado?.toUpperCase()}</div></div></div><div class="pbar"><div class="dato"><span class="dlbl">Nombre</span><span class="dval">${p.nombre||"—"}</span></div><div class="dato"><span class="dlbl">DNI</span><span class="dval">${p.dni||"—"}</span></div><div class="dato"><span class="dlbl">Edad</span><span class="dval">${p.edad||"—"} años</span></div><div class="dato"><span class="dlbl">Empresa</span><span class="dval">${p.empresa||"—"}</span></div><div class="dato"><span class="dlbl">Cargo</span><span class="dval">${p.cargo||"—"}</span></div></div><div class="body"><div class="sec"><div class="stit">📋 Anamnesis</div><div class="sbody">${hc.anamnesis.aiText?`<div class="ai">${hc.anamnesis.aiText}</div>`:`<p>${hc.anamnesis.motivo||"—"}</p>`}</div></div><div class="sec"><div class="stit">🏭 Antecedentes Ocupacionales</div><div class="sbody">${hc.antOcup.aiText?`<div class="ai">${hc.antOcup.aiText}</div>`:`<p>${hc.antOcup.exposiciones||"—"}</p>`}</div></div><div class="sec"><div class="stit">🩺 Examen Físico</div><div class="sbody"><p>PA:${hc.exFisico.pa||"—"} | FC:${hc.exFisico.fc||"—"} | FR:${hc.exFisico.fr||"—"} | T°:${hc.exFisico.temp||"—"} | Peso:${hc.exFisico.peso||"—"}kg | Talla:${hc.exFisico.talla||"—"}m | IMC:${imcVal}</p>${hc.exFisico.aiText?`<div class="ai">${hc.exFisico.aiText}</div>`:""}</div></div>${hc.laboratorio.aiText?`<div class="sec"><div class="stit">🔬 Laboratorio</div><div class="sbody"><div class="ai">${hc.laboratorio.aiText}</div></div></div>`:""}<div class="sec"><div class="stit">🏷 Diagnóstico CIE-10</div><div class="sbody"><p><strong>${hc.diagnostico.cie10||"—"}</strong></p>${hc.diagnostico.aiText?`<div class="ai">${hc.diagnostico.aiText}</div>`:""}</div></div><div class="sec"><div class="stit">💊 Plan / Indicaciones</div><div class="sbody">${hc.plan.aiText?`<div class="ai">${hc.plan.aiText}</div>`:`<p>${hc.plan.indicaciones||"—"}</p>`}</div></div><div class="sec"><div class="stit">✅ Aptitud Médico-Ocupacional</div><div class="sbody"><div class="apt">${hc.aptitud.resultado.toUpperCase()}</div>${hc.aptitud.restricciones?`<p style="font-size:12px;color:#718096">Restricciones: ${hc.aptitud.restricciones}</p>`:""}${hc.aptitud.aiText?`<div class="ai">${hc.aptitud.aiText}</div>`:""}</div></div>${hc.interconsultas.length?`<div class="sec"><div class="stit">🔀 Interconsultas</div><div class="sbody">${hc.interconsultas.map(ic=>`<div style="border:1px solid #E9D8FD;border-radius:8px;padding:10px;margin-bottom:8px;background:#FAF5FF"><strong style="color:#9F7AEA">${ic.especialidad}</strong> · ${ic.urgencia} · ${ic.estado}<br/>${ic.aiText||ic.motivo||""}</div>`).join("")}</div></div>`:""}<div class="firma-z"><div class="firma-c"><img src="${FIRMA_B64}" style="width:200px;height:50px;object-fit:contain;display:block;margin:0 auto 6px"/><div style="width:220px;border-bottom:1.5px solid #2D3748;margin:0 auto 6px"></div><div style="font-weight:800;font-size:14px">Dr. Miguel Wenceslao Ochoa Cuadros</div><div style="font-size:11px;color:#718096">Médico Ocupacional · CMP 102517 · RNE/RNA 13334</div></div></div></div><div class="footer"><strong style="color:#4A90D9">PANACEA MEDICINA OCUPACIONAL</strong> · panaceamedocup@gmail.com · Arequipa, Perú<br/>Generado el ${new Date().toLocaleDateString("es-PE",{year:"numeric",month:"long",day:"numeric"})}</div></div></body></html>`;
    const blob=new Blob([html],{type:"text/html;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=`HC_${p.nombre||"paciente"}_${hc.fecha}.html`;a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);toast("⬇ HC exportada con firma");
  },[hc,imc,toast]);

  const badgeColor=e=>e==="guardada"?C.green:e==="pendiente-médico"?C.amber:C.gray;

  return(
    <div style={{minHeight:"100vh",background:C.bg,fontFamily:"'Segoe UI',system-ui,sans-serif",color:C.text}}>
      {notif&&<div style={{position:"fixed",top:16,right:16,background:C.teal,color:"#fff",padding:"10px 18px",borderRadius:10,fontWeight:700,fontSize:13,zIndex:999,boxShadow:"0 4px 16px rgba(0,0,0,.12)"}}>{notif}</div>}

      {/* HEADER */}
      <div style={{background:"linear-gradient(135deg,#4A90D9 0%,#38B2AC 100%)",color:"#fff",padding:"14px 24px",boxShadow:"0 2px 12px rgba(74,144,217,.3)"}}>
        <div style={{maxWidth:980,margin:"0 auto",display:"flex",alignItems:"center",gap:14}}>
          <div style={{width:46,height:46,borderRadius:"50%",background:"rgba(255,255,255,.2)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:20,flexShrink:0}}>P</div>
          <div>
            <div style={{fontSize:21,fontWeight:900,letterSpacing:1}}>PANACEA MEDWEB</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,.85)",display:"flex",alignItems:"center",gap:6}}>
              Historia Clínica con IA · Dr. Ochoa Cuadros CMP 102517
              <span style={{background:dbOnline===null?"rgba(255,255,255,.3)":dbOnline?"#48BB78":"#FC8181",borderRadius:20,padding:"1px 8px",fontSize:10,fontWeight:700}}>
                {dbOnline===null?"⏳":dbOnline?"☁ OK":"⚠ Sin conexión"}
              </span>
            </div>
          </div>
        </div>
      </div>

      {/* NAVBAR */}
      <div style={{background:C.white,borderBottom:`1px solid ${C.border}`,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
        <div style={{maxWidth:980,margin:"0 auto",padding:"0 24px",display:"flex",alignItems:"center",gap:4}}>
          {[{key:"historial",label:"📋 Historial"},{key:"editor",label:"✏ Editor HC"},{key:"dashboard",label:"📊 Dashboard Metabólico"},{key:"epidemio",label:"🏭 Epidemiología"}].map(n=>(
            <button key={n.key} onClick={()=>setVista(n.key)} style={{padding:"11px 16px",fontSize:13,fontWeight:700,cursor:"pointer",border:"none",background:"transparent",color:vista===n.key?C.blue:C.gray,borderBottom:vista===n.key?`3px solid ${C.blue}`:"3px solid transparent"}}>{n.label}</button>
          ))}
          <div style={{marginLeft:"auto",display:"flex",gap:8,padding:"8px 0",alignItems:"center"}}>
            <Btn label="+ Nueva HC" onClick={nuevaHC} color={C.green} small/>
            <button onClick={importarEnfermeria} style={{borderRadius:8,padding:"5px 12px",fontSize:11,fontWeight:700,cursor:"pointer",border:"none",background:pendientesEnf>0?C.red:C.amber,color:pendientesEnf>0?"#fff":"#000",display:"inline-flex",alignItems:"center",gap:5}}>
              ⬇ Importar Enfermería {pendientesEnf>0&&<span style={{background:"rgba(255,255,255,.3)",borderRadius:"50%",width:18,height:18,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:900}}>{pendientesEnf}</span>}
            </button>
          </div>
        </div>
      </div>

      <div style={{maxWidth:980,margin:"0 auto",padding:"20px 14px"}}>

        {/* HISTORIAL */}
        {vista==="historial"&&(
          <div>
            <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap",alignItems:"flex-end"}}>
              <input style={{border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 12px",fontSize:13,background:C.grayLight,outline:"none",color:C.text,flex:2,minWidth:200}} placeholder="🔍 Nombre o DNI..." value={busqPac} onChange={e=>setBusqPac(e.target.value)}/>
              <input type="date" style={{border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 12px",fontSize:13,background:C.grayLight,outline:"none",color:C.text,flex:1,minWidth:140}} value={busqFecha} onChange={e=>setBusqFecha(e.target.value)}/>
              <select style={{border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 12px",fontSize:13,background:C.grayLight,color:C.text,flex:1,minWidth:140}} value={busqEmpresa} onChange={e=>setBusqEmpresa(e.target.value)}>
                <option value="">Todas las empresas</option>{empresas.map(e=><option key={e} value={e}>{e}</option>)}
              </select>
              {(busqPac||busqFecha||busqEmpresa)&&<Btn label="✕ Limpiar" onClick={()=>{setBusqPac("");setBusqFecha("");setBusqEmpresa("");}} color={C.gray} small/>}
              <span style={{fontSize:12,color:C.textSoft,whiteSpace:"nowrap"}}>{filtrados.length} registro(s)</span>
            </div>
            {loadingDB?(<div style={{textAlign:"center",padding:"52px 0",color:C.textSoft}}>⏳ Cargando...</div>)
            :filtrados.length===0?(<div style={{textAlign:"center",padding:"52px 0",color:C.textSoft}}><div style={{fontSize:48,marginBottom:10}}>🗂</div><div style={{fontWeight:700,fontSize:16}}>Sin historias clínicas</div></div>)
            :(<div style={{background:C.white,border:`1px solid ${C.border}`,borderRadius:14,overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,.05)"}}>
              {filtrados.map((h,i)=>(
                <div key={h.id} onClick={()=>abrirHC(h)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 16px",borderBottom:i<filtrados.length-1?`1px solid ${C.border}`:"none",cursor:"pointer",background:i%2===0?C.white:C.grayLight}}>
                  <div style={{width:36,height:36,borderRadius:"50%",background:C.blueLight,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,color:C.blue,fontSize:14,flexShrink:0}}>{(h.paciente.nombre[0]||"?").toUpperCase()}</div>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:13}}>{h.paciente.nombre||"Sin nombre"}</div>
                    <div style={{fontSize:11,color:C.textSoft}}>DNI: {h.paciente.dni||"—"} · {h.paciente.empresa||"—"} · {h.paciente.cargo||"—"}</div>
                  </div>
                  <div style={{textAlign:"right",display:"flex",flexDirection:"column",gap:3,alignItems:"flex-end"}}>
                    <div style={{fontSize:11,color:C.textSoft}}>{h.fecha}</div>
                    <span style={{background:badgeColor(h.estado),color:"#fff",borderRadius:20,padding:"2px 9px",fontSize:11,fontWeight:700}}>{h.estado}</span>
                    {h.fromEnfermeria&&<span style={{background:C.teal,color:"#fff",borderRadius:20,padding:"2px 9px",fontSize:10,fontWeight:700}}>ENF</span>}
                    {h.interconsultas?.filter(ic=>ic.estado==="Pendiente").length>0&&<span style={{background:C.purple,color:"#fff",borderRadius:20,padding:"2px 9px",fontSize:10,fontWeight:700}}>🔀 {h.interconsultas.filter(ic=>ic.estado==="Pendiente").length} IC</span>}
                  </div>
                  <button onClick={e=>{e.stopPropagation();eliminarHC(h.id);}} style={{background:C.redLight,border:`1px solid ${C.red}`,color:C.red,borderRadius:7,padding:"4px 9px",cursor:"pointer",fontSize:11,fontWeight:700,marginLeft:8}}>🗑</button>
                </div>
              ))}
            </div>)}
          </div>
        )}

        {/* EDITOR */}
        {vista==="editor"&&(
          <div>
            <div style={{display:"flex",gap:8,marginBottom:14,alignItems:"center",flexWrap:"wrap"}}>
              <button onClick={()=>setVista("historial")} style={{background:C.grayLight,border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",color:C.text}}>← Historial</button>
              {hc.fromEnfermeria&&<span style={{background:C.teal,color:"#fff",borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:700}}>Importado de Enfermería</span>}
              <div style={{marginLeft:"auto",display:"flex",gap:8}}>
                <Btn label="💾 Guardar" onClick={guardarHC} color={C.green} small/>
                <Btn label="⬇ Exportar HTML" onClick={exportarHC} color={C.blue} small/>
              </div>
            </div>

            <Card title="Datos del Paciente" icon="👤" tag="IDENTIFICACIÓN" tagColor={C.blue} accent={C.blueLight}>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
                <Field label="Nombre" value={hc.paciente.nombre} onChange={v=>upd("paciente","nombre",v)}/>
                <Field label="DNI"    value={hc.paciente.dni}    onChange={v=>upd("paciente","dni",v)}/>
                <Field label="Edad"   value={hc.paciente.edad}   onChange={v=>upd("paciente","edad",v)} type="number"/>
                <Field label="Sexo"   value={hc.paciente.sexo||"M"} onChange={v=>upd("paciente","sexo",v)} type="select" options={["M","F"]}/>
                <Field label="Fecha"  value={hc.fecha} onChange={v=>setHC(h=>({...h,fecha:v}))} type="date"/>
              </div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                <Field label="Empresa" value={hc.paciente.empresa} onChange={v=>upd("paciente","empresa",v)}/>
                <Field label="Cargo"   value={hc.paciente.cargo}   onChange={v=>upd("paciente","cargo",v)}/>
              </div>
            </Card>

            <HCSection title="Anamnesis" icon="📋" tag="SUBJETIVO" tagColor={C.purple} accent={C.purpleLight} aiText={hc.anamnesis.aiText} aiLoading={ldg.an} onAI={genAnamnesis} onAIEdit={v=>upd("anamnesis","aiText",v)}>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
                <Field label="Motivo"    value={hc.anamnesis.motivo}   onChange={v=>upd("anamnesis","motivo",v)} full/>
                <Field label="Evolución" value={hc.anamnesis.tEvol}    onChange={v=>upd("anamnesis","tEvol",v)}/>
                <Field label="Síntomas"  value={hc.anamnesis.sintomas} onChange={v=>upd("anamnesis","sintomas",v)}/>
              </div>
            </HCSection>

            <HCSection title="Antecedentes Ocupacionales" icon="🏭" tag="OCUPACIONAL" tagColor={C.amber} accent={C.amberLight} aiText={hc.antOcup.aiText} aiLoading={ldg.ao} onAI={genAntOcup} onAIEdit={v=>upd("antOcup","aiText",v)}>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
                <Field label="Exposiciones"      value={hc.antOcup.exposiciones} onChange={v=>upd("antOcup","exposiciones",v)} full/>
                <Field label="Tiempo de servicio" value={hc.antOcup.tiempo}      onChange={v=>upd("antOcup","tiempo",v)}/>
                <Field label="EPPs"              value={hc.antOcup.epps}         onChange={v=>upd("antOcup","epps",v)}/>
              </div>
            </HCSection>

            <HCSection title="Examen Físico" icon="🩺" tag="OBJETIVO" tagColor={C.teal} accent={C.tealLight} aiText={hc.exFisico.aiText} aiLoading={ldg.ef} onAI={genExFisico} aiLabel="✦ Interpretar con IA" onAIEdit={v=>upd("exFisico","aiText",v)}>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
                {[["pa","PA (mmHg)"],["fc","FC (lpm)"],["fr","FR (rpm)"],["temp","Temp °C"]].map(([k,l])=>{
                  const{color,bg}=paramStatus(k,hc.exFisico[k]);
                  return<BadgeValue key={k} label={l} value={hc.exFisico[k]} color={color} bg={bg}/>;
                })}
              </div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
                <Field label="Peso kg"  value={hc.exFisico.peso}   onChange={v=>upd("exFisico","peso",v)}/>
                <Field label="Talla m"  value={hc.exFisico.talla}  onChange={v=>upd("exFisico","talla",v)}/>
                <div style={{display:"flex",flexDirection:"column",gap:3,flex:1,minWidth:90}}>
                  <label style={{fontSize:11,fontWeight:700,color:C.textSoft,textTransform:"uppercase"}}>IMC</label>
                  <div style={{border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 10px",fontSize:14,fontWeight:700,color:C.blue,background:C.blueLight}}>{imc()}</div>
                </div>
              </div>
              <Field label="Hallazgos por sistemas" value={hc.exFisico.hallazgos} onChange={v=>upd("exFisico","hallazgos",v)} type="textarea" full/>
            </HCSection>

            <Card title="Laboratorio" icon="🔬" tag="ANÁLISIS" tagColor={C.green} accent={C.greenLight}>
              <input ref={labRef} type="file" accept="application/pdf" style={{display:"none"}} onChange={handleLabPDF}/>
              <button onClick={()=>labRef.current.click()} style={{border:`2px dashed ${C.green}`,borderRadius:10,padding:"14px 20px",textAlign:"center",cursor:"pointer",background:C.greenLight,width:"100%",color:C.green,fontWeight:700,fontSize:13}}>📎 Cargar PDF de laboratorio</button>
              <AIResult text={hc.laboratorio.aiText} loading={ldg.lab}/>
              {hc.laboratorio.aiText&&<div style={{marginTop:8}}><Field label="✏ Editar" value={hc.laboratorio.aiText} onChange={v=>setHC(h=>({...h,laboratorio:{aiText:v,resumen:v}}))} type="textarea" full/></div>}
            </Card>

            <HCSection title="Diagnóstico CIE-10" icon="🏷" tag="DIAGNÓSTICO" tagColor={C.red} accent={C.redLight} aiText={hc.diagnostico.aiText} aiLoading={ldg.dx} onAI={genDx} aiLabel="✦ Sugerir con IA">
              <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
                <Field label="CIE-10 frecuente" value={hc.diagnostico.cie10} onChange={v=>upd("diagnostico","cie10",v)} type="select" options={["— Seleccionar —",...CIE10]}/>
                <Field label="O escribir diagnóstico" value={hc.diagnostico.cie10} onChange={v=>upd("diagnostico","cie10",v)}/>
              </div>
            </HCSection>

            <HCSection title="Plan / Indicaciones" icon="💊" tag="TRATAMIENTO" tagColor={C.blue} accent={C.blueLight} aiText={hc.plan.aiText} aiLoading={ldg.pl} onAI={genPlan} aiLabel="✦ Generar plan con IA + Web 🌐" onAIEdit={v=>upd("plan","aiText",v)}>
              <Field label="Notas" value={hc.plan.indicaciones} onChange={v=>upd("plan","indicaciones",v)} type="textarea" full/>
            </HCSection>

            <HCSection title="Aptitud Médico-Ocupacional" icon="✅" tag="CAMO" tagColor={C.teal} accent={C.tealLight} aiText={hc.aptitud.aiText} aiLoading={ldg.apt} onAI={genAptitud} onAIEdit={v=>upd("aptitud","aiText",v)}>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
                <Field label="Resultado" value={hc.aptitud.resultado} onChange={v=>upd("aptitud","resultado",v)} type="select" options={["Apto","Apto con restricciones","No apto temporal","No apto permanente"]}/>
                <Field label="Restricciones" value={hc.aptitud.restricciones} onChange={v=>upd("aptitud","restricciones",v)}/>
              </div>
              <span style={{background:hc.aptitud.resultado==="Apto"?C.green:hc.aptitud.resultado.includes("restricciones")?C.amber:C.red,color:"#fff",borderRadius:20,padding:"3px 12px",fontSize:12,fontWeight:700}}>{hc.aptitud.resultado.toUpperCase()}</span>
            </HCSection>

            <Card title="Interconsultas" icon="🔀" tag="DERIVACIONES" tagColor={C.purple} accent={C.purpleLight}>
              <div style={{marginBottom:10}}><Btn label="+ Agregar" onClick={addIC} color={C.purple} small/></div>
              {hc.interconsultas.length===0&&<div style={{color:C.textSoft,fontSize:12,textAlign:"center",padding:"10px 0"}}>Sin interconsultas registradas</div>}
              {hc.interconsultas.map(ic=>(
                <div key={ic.id} style={{border:`1px solid ${C.border}`,borderRadius:10,padding:12,marginBottom:10,background:C.grayLight}}>
                  <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:8}}>
                    <Field label="Especialidad" value={ic.especialidad} onChange={v=>updIC(ic.id,"especialidad",v)} type="select" options={ESPECIALIDADES}/>
                    <Field label="Urgencia"     value={ic.urgencia}    onChange={v=>updIC(ic.id,"urgencia",v)}    type="select" options={["Electiva","Preferente","Urgente"]}/>
                    <Field label="Estado"       value={ic.estado}      onChange={v=>updIC(ic.id,"estado",v)}      type="select" options={["Pendiente","Enviada","Respondida"]}/>
                  </div>
                  <Field label="Motivo" value={ic.motivo} onChange={v=>updIC(ic.id,"motivo",v)} type="textarea" full/>
                  <div style={{display:"flex",gap:8,marginTop:8}}>
                    <Btn label="✦ Redactar con IA" onClick={()=>genIC(ic.id)} color={C.purple} small/>
                    <Btn label="🗑" onClick={()=>delIC(ic.id)} color={C.red} small/>
                  </div>
                  {ldg["ic_"+ic.id]&&<div style={{color:C.blue,fontSize:12,fontStyle:"italic",marginTop:7}}>⏳ IA procesando...</div>}
                  {ic.aiText&&<><div style={{background:C.purpleLight,border:`1px solid ${C.purple}`,borderRadius:8,padding:"9px 12px",fontSize:12,marginTop:7,lineHeight:1.6}}><strong style={{color:C.purple}}>✦ IA:</strong> {ic.aiText}</div><div style={{marginTop:8}}><Field label="✏ Editar" value={ic.aiText} onChange={v=>updIC(ic.id,"aiText",v)} type="textarea" full/></div></>}
                </div>
              ))}
            </Card>

            <div style={{display:"flex",gap:8,justifyContent:"flex-end",paddingBottom:28}}>
              <Btn label="← Volver"        onClick={()=>setVista("historial")} color={C.gray} small/>
              <Btn label="💾 Guardar HC"   onClick={guardarHC} color={C.green}/>
              <Btn label="⬇ Exportar HTML" onClick={exportarHC} color={C.blue}/>
            </div>
          </div>
        )}

        {/* DASHBOARD METABÓLICO */}
        {vista==="dashboard"&&(
          <div>
            <div style={{display:"flex",gap:8,marginBottom:16,alignItems:"center",flexWrap:"wrap"}}>
              {dashVista!=="buscar"&&<button onClick={()=>{setDashVista("buscar");setDashPac(null);setDashConsultas([]);}} style={{background:C.grayLight,border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",color:C.text}}>← Cambiar paciente</button>}
              {dashPac&&dashVista==="dashboard"&&<Btn label="+ Nueva consulta" onClick={()=>setDashVista("nueva")} color={C.green} small/>}
              {dashPac&&<span style={{fontSize:13,fontWeight:700,color:C.text}}>{dashPac.paciente?.nombre||dashPac.nombre}</span>}
            </div>

            {dashVista==="buscar"&&(
              <div style={{maxWidth:560,margin:"0 auto"}}>
                <div style={{textAlign:"center",padding:"24px 0 20px"}}><div style={{fontSize:44,marginBottom:8}}>📊</div><div style={{fontWeight:800,fontSize:18}}>Seguimiento Metabólico</div></div>
                <input value={dashBusq} onChange={e=>setDashBusq(e.target.value)} placeholder="🔍 Buscar paciente..." style={{width:"100%",border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 14px",fontSize:14,background:C.white,outline:"none",color:C.text,boxSizing:"border-box",marginBottom:14}}/>
                <div style={{background:C.white,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden"}}>
                  {historial.filter(h=>{const n=h.paciente?.nombre?.toLowerCase()||"";return n.includes(dashBusq.toLowerCase())||h.paciente?.dni?.includes(dashBusq);}).filter((h,i,arr)=>arr.findIndex(x=>x.paciente?.dni===h.paciente?.dni)===i).map((h,i,arr)=>(
                    <div key={h.id} onClick={()=>selDashPac(h)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderBottom:i<arr.length-1?`1px solid ${C.border}`:"none",cursor:"pointer",background:i%2===0?C.white:C.grayLight}}>
                      <div style={{width:34,height:34,borderRadius:"50%",background:C.blueLight,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,color:C.blue,fontSize:13}}>{(h.paciente?.nombre?.[0]||"?").toUpperCase()}</div>
                      <div style={{flex:1}}><div style={{fontWeight:700,fontSize:13}}>{h.paciente?.nombre||"—"}</div><div style={{fontSize:11,color:C.textSoft}}>DNI: {h.paciente?.dni||"—"} · {h.paciente?.empresa||"—"}</div></div>
                      <span style={{fontSize:12,color:C.blue,fontWeight:700}}>Ver →</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {dashVista==="dashboard"&&dashPac&&(()=>{
              const semActual=ultimaC?.semaforo||(ultimaC?calcSemaforo(ultimaC):null);
              const smLevel=sm?.dx?.includes("✓")?"Alto":sm?.dx?.includes("Riesgo")?"Moderado":"Bajo";
              return(
                <div>
                  <div style={{display:"flex",gap:12,marginBottom:14,flexWrap:"wrap"}}>
                    <div style={{flex:2,minWidth:200,background:C.white,border:`1px solid ${C.border}`,borderRadius:14,padding:"14px 18px"}}>
                      <div style={{fontWeight:800,fontSize:15}}>{dashPac.paciente?.nombre||dashPac.nombre}</div>
                      <div style={{fontSize:11,color:C.textSoft}}>DNI: {dashPac.paciente?.dni||dashPac.dni} · {dashPac.paciente?.empresa||dashPac.empresa||"—"}</div>
                      <div style={{fontSize:12,color:C.textSoft,marginTop:4}}>Consultas: <strong style={{color:C.blue}}>{dashConsultas.length}</strong></div>
                    </div>
                    {ultimaC&&<div style={{flex:1,minWidth:130,background:riskColor(semActual),borderRadius:14,padding:14,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"#fff"}}>
                      <div style={{fontWeight:900,fontSize:17}}>{semActual}</div>
                      <div style={{fontSize:10,opacity:.9}}>Riesgo metabólico</div>
                      <div style={{fontSize:11,fontWeight:700,marginTop:4}}>{ultimaC.dx_metabolico}</div>
                    </div>}
                    {sm&&<div style={{flex:1,minWidth:150,background:riskBg(smLevel),border:`1px solid ${riskColor(smLevel)}`,borderRadius:14,padding:14,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
                      <div style={{fontSize:11,fontWeight:700,color:C.textSoft,textTransform:"uppercase",marginBottom:4}}>S. Metabólico IDF</div>
                      <div style={{fontSize:12,fontWeight:800,color:riskColor(smLevel),textAlign:"center"}}>{sm.dx}</div>
                      <div style={{fontSize:10,color:C.textSoft,marginTop:4}}>{sm.otros}/4 criterios</div>
                    </div>}
                    {atero.global&&<div style={{flex:1,minWidth:120,background:riskBg(atero.global),border:`1px solid ${riskColor(atero.global)}`,borderRadius:14,padding:14,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
                      <div style={{fontSize:11,fontWeight:700,color:C.textSoft,textTransform:"uppercase",marginBottom:4}}>Índice Aterogénico</div>
                      <div style={{fontSize:15,fontWeight:900,color:riskColor(atero.global)}}>{atero.global}</div>
                    </div>}
                  </div>

                  {dashConsultas.length===0?(
                    <div style={{textAlign:"center",padding:40,color:C.textSoft,background:C.white,borderRadius:14,border:`1px solid ${C.border}`}}><div style={{fontSize:36,marginBottom:8}}>📋</div><div style={{fontWeight:700}}>Sin consultas metabólicas</div></div>
                  ):(
                    <>
                      {(atero.ct_hdl||atero.ldl_hdl||atero.tg_hdl)&&(
                        <Card title="Índice Aterogénico" icon="🫀" tag="Última consulta" tagColor={C.red} accent={C.redLight}>
                          <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:12}}>
                            <AteroBadge label="CT / HDL (Castelli I)"   value={atero.ct_hdl}  riesgo={atero.ct_hdl_riesgo}/>
                            <AteroBadge label="LDL / HDL (Castelli II)" value={atero.ldl_hdl} riesgo={atero.ldl_hdl_riesgo}/>
                            <AteroBadge label="TG / HDL (aterogénico)"  value={atero.tg_hdl}  riesgo={atero.tg_hdl_riesgo}/>
                          </div>
                          <div style={{background:C.grayLight,borderRadius:8,padding:"8px 12px",fontSize:11,color:C.textSoft}}>CT/HDL &lt;3.5=Bajo · LDL/HDL &lt;2.5=Bajo · TG/HDL &lt;2=Bajo</div>
                        </Card>
                      )}

                      {sm&&(
                        <Card title="Síndrome Metabólico — Criterios IDF 2006" icon="⚕️" tag={sm.dx} tagColor={riskColor(smLevel)} accent={riskBg(smLevel)}>
                          <div style={{fontSize:11,color:C.textSoft,marginBottom:10}}>Criterio central: <strong>Circunferencia Abdominal</strong> (H≥90cm / M≥80cm) + 2 de 4 criterios</div>
                          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
                            <SMBadge label="Circ. Abdominal" positivo={sm.criterios.ca} noEval={sm.criterios.ca===null} valor={ultimaC?.circunferencia_abdominal?`${ultimaC.circunferencia_abdominal} cm`:null}/>
                            <SMBadge label="TG ≥150"         positivo={sm.criterios.tg} noEval={sm.criterios.tg===null} valor={ultimaC?.trigliceridos?`${ultimaC.trigliceridos} mg/dL`:null}/>
                            <SMBadge label={`HDL <${dashPac.paciente?.sexo==="F"?"50":"40"}`} positivo={sm.criterios.hdl} noEval={sm.criterios.hdl===null} valor={ultimaC?.hdl?`${ultimaC.hdl} mg/dL`:null}/>
                            <SMBadge label="PA ≥130/85"      positivo={sm.criterios.pa} noEval={sm.criterios.pa===null} valor={(ultimaC?.pa_sistolica&&ultimaC?.pa_diastolica)?`${ultimaC.pa_sistolica}/${ultimaC.pa_diastolica}`:null}/>
                            <SMBadge label="Glucosa ≥100"    positivo={sm.criterios.gluc} noEval={sm.criterios.gluc===null} valor={ultimaC?.glucosa_ayunas?`${ultimaC.glucosa_ayunas} mg/dL`:null}/>
                          </div>
                          {sm.criterios.ca===null&&<div style={{background:C.amberLight,border:`1px solid ${C.amber}`,borderRadius:8,padding:"8px 12px",fontSize:11,color:"#7B4F00"}}>⚠️ Ingresar <strong>circunferencia abdominal</strong> para evaluación completa.</div>}
                        </Card>
                      )}
