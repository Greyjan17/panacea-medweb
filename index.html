function paramStatus(key,val){
  if(!val)return{color:C.border,bg:C.grayLight};
  var p=PARAM_RANGES[key];if(!p)return{color:C.border,bg:C.grayLight};
  var n=p.parse?p.parse(val):parseFloat(val);if(isNaN(n))return{color:C.border,bg:C.grayLight};
  if(p.inv){var c=n<p.min?C.red:C.green;return{color:c,bg:c+"18"};}
  var c2=n>p.max?C.red:n<p.min?C.blue:C.green;return{color:c2,bg:c2+"18"};
}

function calcAtero(ct,hdl,ldl,tg){
  var r={};
  if(ct&&hdl&&hdl>0){r.ct_hdl=(ct/hdl).toFixed(2);r.ct_hdl_riesgo=ct/hdl>5?"Alto":ct/hdl>3.5?"Moderado":"Bajo";}
  if(ldl&&hdl&&hdl>0){r.ldl_hdl=(ldl/hdl).toFixed(2);r.ldl_hdl_riesgo=ldl/hdl>3.5?"Alto":ldl/hdl>2.5?"Moderado":"Bajo";}
  if(tg&&hdl&&hdl>0){r.tg_hdl=(tg/hdl).toFixed(2);r.tg_hdl_riesgo=tg/hdl>3.8?"Alto":tg/hdl>2?"Moderado":"Bajo";}
  var vals=[r.ct_hdl_riesgo,r.ldl_hdl_riesgo,r.tg_hdl_riesgo];
  r.global=(!r.ct_hdl_riesgo&&!r.ldl_hdl_riesgo&&!r.tg_hdl_riesgo)?null:vals.includes("Alto")?"Alto":vals.includes("Moderado")?"Moderado":"Bajo";
  return r;
}

function calcSM(row,sexo){
  sexo=sexo||"M";
  var tg=parseFloat(row.trigliceridos),hdl=parseFloat(row.hdl),gluc=parseFloat(row.glucosa_ayunas);
  var pas=parseFloat(row.pa_sistolica),pad=parseFloat(row.pa_diastolica),ca=parseFloat(row.circunferencia_abdominal);
  var criterios={
    ca:!isNaN(ca)?(sexo==="M"?ca>=90:ca>=80):null,
    tg:!isNaN(tg)?tg>=150:null,
    hdl:!isNaN(hdl)?(sexo==="M"?hdl<40:hdl<50):null,
    pa:(!isNaN(pas)&&!isNaN(pad))?(pas>=130||pad>=85):null,
    gluc:!isNaN(gluc)?gluc>=100:null,
  };
  var positivos=Object.values(criterios).filter(function(v){return v===true;}).length;
  var otros=[criterios.tg,criterios.hdl,criterios.pa,criterios.gluc].filter(function(v){return v===true;}).length;
  var dx="Sin criterios suficientes";
  if(criterios.ca!==null){
    if(criterios.ca&&otros>=2)dx="Síndrome Metabólico ✓";
    else if(criterios.ca&&otros===1)dx="Riesgo SM (CA + 1 criterio)";
    else if(criterios.ca)dx="Obesidad central sin SM";
    else dx="Sin SM (CA normal)";
  }else{dx=positivos>=3?"Posible SM (sin CA)":"Sin criterios suficientes";}
  return{criterios:criterios,positivos:positivos,dx:dx,caPos:criterios.ca===true,otros:otros};
}

function calcSemaforo(row){
  var a=0;
  if(row.imc>30)a+=2;else if(row.imc>25)a++;
  if(row.pa_sistolica>140||row.pa_diastolica>90)a+=2;else if(row.pa_sistolica>130)a++;
  if(row.colesterol_total>240)a+=2;else if(row.colesterol_total>200)a++;
  if(row.hdl<40)a+=2;
  if(row.ldl>160)a+=2;else if(row.ldl>130)a++;
  if(row.trigliceridos>500)a+=3;else if(row.trigliceridos>200)a+=2;else if(row.trigliceridos>150)a++;
  if(row.glucosa_ayunas>126)a+=3;else if(row.glucosa_ayunas>100)a++;
  if(row.hba1c>6.5)a+=3;else if(row.hba1c>5.7)a++;
  if(row.acido_urico>7)a++;
  return a===0?"Verde":a<=3?"Amarillo":"Rojo";
}

function tend(a,b){
  if(!a||!b)return null;
  var d=((a-b)/b*100).toFixed(1);
  if(Math.abs(d)<2)return{icon:"→",color:C.gray,d:d};
  return a>b?{icon:"↑",color:C.red,d:"+"+d}:{icon:"↓",color:C.green,d:d};
}

function clasificarGrupo(exp){
  if(!exp||!exp.trim())return"sin_exposicion";
  var e=exp.toLowerCase();
  var found=GRUPOS_RIESGO.find(function(g){return g.keywords.some(function(k){return e.includes(k);});});
  return found?found.id:"sin_exposicion";
}

async function callClaude(prompt,web){
  var body={model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:prompt}]};
  if(web)body.tools=[{type:"web_search_20250305",name:"web_search"}];

  var d=await r.json();
  return d.content.filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n");
}

// Gráfico SVG nativo (reemplaza Recharts)
const LineChartSVG=memo(function({data,params,paramsMeta,refLines}){
  var W=600,H=220,padL=40,padR=20,padT=10,padB=30;
  var chartW=W-padL-padR,chartH=H-padT-padB;
  if(!data||data.length<2)return <div style={{textAlign:"center",padding:20,color:C.textSoft,fontSize:12}}>Se necesitan al menos 2 consultas para mostrar el gráfico</div>;

  var allVals=[];
  data.forEach(function(d){params.forEach(function(k){var v=parseFloat(d[k]);if(!isNaN(v))allVals.push(v);});});
  if(refLines)refLines.forEach(function(r){allVals.push(r.y);});
  var minV=Math.min.apply(null,allVals)*0.9,maxV=Math.max.apply(null,allVals)*1.1;
  if(minV===maxV){minV=minV*0.8;maxV=maxV*1.2;}

  function xPos(i){return padL+i*(chartW/(data.length-1));}
  function yPos(v){return padT+chartH-(((v-minV)/(maxV-minV))*chartH);}

  return(
    <div style={{overflowX:"auto"}}>
      <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",maxWidth:W,display:"block"}}>
        {/* Grid */}
        {[0,.25,.5,.75,1].map(function(t,i){
          var y=padT+t*chartH;
          return <line key={i} x1={padL} y1={y} x2={W-padR} y2={y} stroke={C.border} strokeDasharray="3 3"/>;
        })}
        {/* Y labels */}
        {[0,.5,1].map(function(t,i){
          var v=(minV+(1-t)*(maxV-minV)).toFixed(0);
          var y=padT+t*chartH;
          return <text key={i} x={padL-4} y={y+4} textAnchor="end" fontSize={9} fill={C.textSoft}>{v}</text>;
        })}
        {/* X labels */}
        {data.map(function(d,i){
          return <text key={i} x={xPos(i)} y={H-4} textAnchor="middle" fontSize={9} fill={C.textSoft}>{d.fecha?d.fecha.slice(5):""}</text>;
        })}
        {/* Ref lines */}
        {(refLines||[]).map(function(r,i){
          var y=yPos(r.y);
          return(<g key={i}><line x1={padL} y1={y} x2={W-padR} y2={y} stroke={r.color} strokeDasharray="6 3" strokeWidth={1.5}/><text x={W-padR+2} y={y+4} fontSize={8} fill={r.color}>{r.label}</text></g>);
        })}
        {/* Lines */}
        {params.map(function(k){
          var meta=paramsMeta[k];
          var pts=data.map(function(d,i){var v=parseFloat(d[k]);return isNaN(v)?null:{x:xPos(i),y:yPos(v)};});
          var segments=[];
          for(var i=0;i<pts.length-1;i++){if(pts[i]&&pts[i+1])segments.push(i);}
          return(
            <g key={k}>
              {segments.map(function(i){return <line key={i} x1={pts[i].x} y1={pts[i].y} x2={pts[i+1].x} y2={pts[i+1].y} stroke={meta.color} strokeWidth={2}/>;}) }
              {pts.map(function(p,i){return p?<circle key={i} cx={p.x} cy={p.y} r={3} fill={meta.color}/>:null;})}
            </g>
          );
        })}
      </svg>
      {/* Leyenda */}
      <div style={{display:"flex",gap:12,flexWrap:"wrap",marginTop:8,paddingLeft:padL}}>
        {params.map(function(k){return(<div key={k} style={{display:"flex",alignItems:"center",gap:4,fontSize:11}}><div style={{width:16,height:3,background:paramsMeta[k].color,borderRadius:2}}></div><span style={{color:C.textSoft}}>{paramsMeta[k].label}</span></div>);})}
      </div>
    </div>
  );
});

const HCSection=memo(function({title,icon,tag,tagColor,accent,children,aiText,aiLoading,onAI,aiLabel,onAIEdit}){

});

                  <Card title="Diagnósticos más frecuentes" icon="🏷" accent={C.blueLight} tagColor={C.blue} tag={"Top "+topDx.length}>
                    {topDx.length===0?<div style={{color:C.textSoft,fontSize:12,textAlign:"center"}}>Sin datos</div>
                    :topDx.map(function(arr,i){var dx=arr[0],n=arr[1];return(<div key={i} style={{marginBottom:8}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:11,flex:1}}>{dx}</span><span style={{fontSize:11,fontWeight:700,color:C.blue,marginLeft:8}}>{n}</span></div><div style={{background:C.border,borderRadius:4,height:6}}><div style={{background:C.blue,borderRadius:4,height:6,width:((n/topDx[0][1])*100)+"%"}}/></div></div>);})}
                  </Card>
                </div>
                <div style={{flex:1,minWidth:260}}>
                  <Card title="Distribución de Aptitud" icon="✅" accent={C.greenLight} tagColor={C.green}>
                    {Object.entries(aptCount).map(function(entry){var k=entry[0],v=entry[1];return(<div key={k} style={{marginBottom:8}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:11}}>{k}</span><span style={{fontSize:11,fontWeight:700,color:k==="Apto"?C.green:k.includes("restricciones")?C.amber:C.red}}>{v} ({base.length?((v/base.length)*100).toFixed(0):0}%)</span></div><div style={{background:C.border,borderRadius:4,height:6}}><div style={{background:k==="Apto"?C.green:k.includes("restricciones")?C.amber:C.red,borderRadius:4,height:6,width:base.length?((v/base.length)*100)+"%":"0%"}}/></div></div>);})}
                  </Card>
                </div>
              </div>

              {icPendientes.length>0&&(
                <Card title="Interconsultas Pendientes" icon="🔀" accent={C.purpleLight} tagColor={C.purple} tag={icPendientes.length+" sin respuesta"}>
                  <div style={{overflowX:"auto"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                      <thead><tr style={{background:C.grayLight}}>{["Paciente","Empresa","Especialidad","Urgencia","Fecha HC"].map(function(h){return <th key={h} style={{padding:"7px 10px",textAlign:"left",fontWeight:700,color:C.textSoft,borderBottom:"1px solid "+C.border,whiteSpace:"nowrap"}}>{h}</th>;})}</tr></thead>
                      <tbody>{icPendientes.map(function(ic,i){return(<tr key={i} style={{borderBottom:"1px solid "+C.border,background:i%2===0?C.white:C.grayLight}}>
                        <td style={{padding:"7px 10px",fontWeight:600}}>{ic.paciente}</td>
                        <td style={{padding:"7px 10px",color:C.textSoft}}>{ic.empresa||"—"}</td>
                        <td style={{padding:"7px 10px"}}>{ic.especialidad}</td>
                        <td style={{padding:"7px 10px"}}><span style={{background:ic.urgencia==="Urgente"?C.red:ic.urgencia==="Preferente"?C.amber:C.gray,color:"#fff",borderRadius:20,padding:"2px 8px",fontSize:10,fontWeight:700}}>{ic.urgencia}</span></td>
                        <td style={{padding:"7px 10px",color:C.textSoft}}>{ic.fecha}</td>
                      </tr>);})}</tbody>
                    </table>
                  </div>
                </Card>
              )}

              {(vencidos.length>0||proximos.length>0)&&(
                <Card title="Alertas de Vencimiento" icon="📅" accent={C.redLight} tagColor={C.red} tag={(vencidos.length+proximos.length)+" alertas"}>
                  {vencidos.concat(proximos.map(function(h){return Object.assign({},h,{_prox:true});})).map(function(h,i){
                    var f=new Date(h.fecha);f.setFullYear(f.getFullYear()+1);var dias=Math.floor((f-hoy)/(1000*60*60*24));
                    return(<div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid "+C.border}}>
                      <span style={{fontSize:16}}>{h._prox?"🟡":"🔴"}</span>
                      <div style={{flex:1}}><div style={{fontWeight:700,fontSize:13}}>{h.paciente.nombre}</div><div style={{fontSize:11,color:C.textSoft}}>{h.paciente.empresa||"—"}</div></div>
                      <div style={{fontSize:11,fontWeight:700,color:h._prox?C.amber:C.red}}>{h._prox?"Vence en "+dias+" días":"Vencido hace "+Math.abs(dias)+" días"}</div>
                      <button onClick={function(){abrirHC(h);}} style={{background:C.blueLight,border:"1px solid "+C.blue,color:C.blue,borderRadius:7,padding:"4px 9px",cursor:"pointer",fontSize:11,fontWeight:700}}>Ver HC</button>
                    </div>);
                  })}
                </Card>
              )}
            </div>
          );
        })()}

      </div>
      <div style={{textAlign:"center",padding:"14px 0",color:C.textSoft,fontSize:11,borderTop:"1px solid "+C.border}}>
        <strong style={{color:C.blue}}>PANACEA MEDWEB</strong> · Dr. Miguel Wenceslao Ochoa Cuadros CMP 102517 · RNE/RNA 13334 · panaceamedocup@gmail.com · Arequipa, Perú
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App,null));
</script>
</body>
</html>
